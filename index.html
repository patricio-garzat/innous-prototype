  async sendRfqToSuppliers(pid){
    const p = findProject(pid);
    // Add to the existing invite list rather than replacing it — this used to
    // wipe out any suppliers (and their already-submitted quotes!) invited in an
    // earlier round the moment INNOUS invited anyone new.
    const newIds = STATE.ui.selectedInviteSuppliers.filter(sid=>!p.invitedSupplierIds.includes(sid));
    if(!newIds.length){ STATE.ui.selectedInviteSuppliers = []; return; }
    // If this is a target-price RFQ and nobody has been invited yet, lock in
    // the markup % and exchange rate right now — the computed MXN budget from
    // this exact moment is what every supplier invited (now or later) will
    // see, so it can never quietly drift under them.
    const lockingTargetPrice = p.targetPriceUsd && p.targetPriceSupplierBudgetMxn==null;
    let projectsUpdate = {};
    if(lockingTargetPrice){
      const markup = getMarkup(p.id, '__target__');
      const rate = getExchangeRate(p.id);
      const budgetMxn = (p.targetPriceUsd / (1 + markup/100)) * rate;
      p.targetPriceMarkupPct = markup; p.targetPriceExchangeRate = rate; p.targetPriceSupplierBudgetMxn = budgetMxn;
      // Same formula, applied per item (fix39) — the Purchase Order needs a
      // real per-item unit price, not just the RFQ-wide total, and this is
      // the one place both the target price and the markup/rate it's about
      // to be locked against are all in scope together. Only items the
      // client actually put a target price on get one; the rest have no
      // basis for an individual price (see generatePurchaseOrderPdf). Since
      // the formula is linear, these always sum exactly back to budgetMxn.
      const itemsWithCost = (p.items||[]).map(it=>it.targetPriceUsd
        ? { ...it, supplierCostMxn: (it.targetPriceUsd/(1+markup/100))*rate }
        : it);
      p.items = itemsWithCost;
      projectsUpdate = { target_price_markup_pct: markup, target_price_exchange_rate: rate, target_price_supplier_budget_mxn: budgetMxn, items: itemsWithCost };
    }
    p.invitedSupplierIds = [...p.invitedSupplierIds, ...newIds];
    newIds.forEach(sid=>{ p.supplierQuotes.push(p.isDemo ? makeQuoteStub(p, sid, false) : makeRealQuoteStub(sid)); });
    if(p.status==='submitted' || p.status==='under_review') p.status = 'sourcing';
    logActivity(p,'INNOUS', `RFQ sent to ${newIds.length} supplier${newIds.length===1?'':'s'}.`);
    if(!p.isDemo){
      const { error: e1 } = await sb.from('invited_suppliers').insert(newIds.map(sid=>({ project_id: p.id, supplier_id: sid })));
      if(e1){ showToast(e1.message); return; }
      const { error: e2 } = await sb.from('supplier_quotes').insert(newIds.map(sid=>({ project_id: p.id, supplier_id: sid, status:'pending' })));
      if(e2){ showToast(e2.message); return; }
      projectsUpdate.status = p.status;
      const { error: e3 } = await sb.from('projects').update(projectsUpdate).eq('id', p.id);
      if(e3){ showToast(e3.message); return; }
    }
    STATE.ui.selectedInviteSuppliers = [];
    showToast(`RFQ enviado a ${newIds.length} proveedor${newIds.length===1?'':'es'}`, 'success');
    route();
  },

  // Reads a supplier's uploaded Constancia de Situación Fiscal (a real PDF
  // text layer, not a scan) via pdf.js, parses it (parseCsfText/
  // csfAddressLine above), and fills the billing DRAFT — never saves on
  // its own, so INNOUS still reviews the fields before Guardar. Also
  // keeps the uploaded PDF on file (suppliers.csf_file_path) for real
  // accounts, so it can be reopened later via App.viewSupplierCsf.
  async onSupplierCsfSelected(id, input){
    const file = input.files && input.files[0]; input.value = '';
    if(!file) return;
    if(!/pdf$/i.test(file.name) && file.type!=='application/pdf'){ showToast('Sube la Constancia de Situación Fiscal en PDF.'); return; }
    showToast('Leyendo la Constancia…');
    try{
      if(!window.pdfjsLib) throw new Error('El lector de PDF no cargó.');
      const buf = await file.arrayBuffer();
      const pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      const page = await pdfDoc.getPage(1);
      const content = await page.getTextContent();
      const text = content.items.map(it=>it.str).join(' ');
      const fields = parseCsfText(text);
      const razonSocial = fields['Denominación/Razón Social:'], rfc = fields['RFC:'];
      if(!razonSocial && !rfc){ showToast('No se pudieron leer los datos — revisa que sea la Constancia de Situación Fiscal del SAT.'); return; }
      if(!STATE.ui.supplierBillingDrafts[id]) STATE.ui.supplierBillingDrafts[id] = {};
      const d = STATE.ui.supplierBillingDrafts[id];
      if(razonSocial) d.legalName = razonSocial;
      if(rfc) d.rfc = rfc;
      const addr = csfAddressLine(fields);
      if(addr) d.address = addr;
      if(isRealAccountId(id)){
        const path = `${id}/csf-${Date.now()}.pdf`;
        const { error: upErr } = await sb.storage.from('account-docs').upload(path, file, { contentType:'application/pdf' });
        if(!upErr){
          await sb.from('suppliers').update({ csf_file_path: path }).eq('user_id', id);
          const s = SUPPLIERS.find(x=>x.id===id); if(s) s.csfFilePath = path;
        }
      }
      showToast('Datos detectados de la Constancia — revisa y guarda.', 'success');
      refreshAccountInfoModalIfOpen('supplier', id);
      route();
    }catch(err){
      console.error('CSF parse failed', err);
      showToast('No se pudo leer el PDF. Verifica el archivo e intenta de nuevo.');
    }
  },

  async addToShortlist(pid,sid){
    const p = findProject(pid);
    if(p.shortlist.length>=5){ showToast('El shortlist ya tiene 5 opciones'); return; }
    const q = p.supplierQuotes.find(x=>x.supplierId===sid);
    const markup = getMarkup(pid,sid);
    const exchangeRate = getExchangeRate(pid);
    // Shipping to the customer (fix41) — snapshotted here too, same as
    // markup/exchange rate: whatever App.setFreight has it at right now is
    // what gets baked into THIS entry's price, permanently. Changing it
    // afterward only affects suppliers added to the shortlist later.
    const freight = getFreight(pid);
    // q.quotedTotal is what the supplier actually typed, in MXN — everything
    // downstream of this point (margin math, the client's shortlist, the
    // formal quote PDF) works in USD, so the conversion happens exactly
    // once, right here, using whatever rate INNOUS had set at this moment.
    // The original MXN total and the rate used are kept alongside it purely
    // as INNOUS's own record of what's actually owed to the supplier.
    const supplierCost = q.quotedTotal/exchangeRate;
    const customerPrice = supplierCost*(1+markup/100) + freight;
    p.shortlist.push({supplierId:sid, supplierCost, supplierCostMxn:q.quotedTotal, exchangeRate, markupPct:markup, freightUsd:freight, customerPrice, leadTimeDays:q.leadTimeDays, rating:q.rating, addedAt:new Date('2026-09-08')});
    const badges = computeBadges(p.shortlist);
    p.shortlist.forEach(s=>s.badge=badges[s.supplierId]);
    if(p.status==='sourcing') p.status='quotes_received';
    if(!p.isDemo){
      const { error: e1 } = await sb.from('shortlist').upsert({
        project_id: pid, supplier_id: sid, supplier_cost: supplierCost, supplier_cost_mxn: q.quotedTotal, exchange_rate: exchangeRate, markup_pct: markup,
        freight_usd: freight, customer_price: customerPrice, lead_time_days: q.leadTimeDays, rating: q.rating||0,
      });
      if(e1){ showToast(e1.message); return; }
      // Badges are recomputed across the whole shortlist every time (best price gets a badge, etc.)
      // so every row's badge needs to be re-saved, not just the one just added.

  async submitSupplierQuote(e,pid){
    e.preventDefault();
    const f = new FormData(e.target);
    const p = findProject(pid);
    const draft = STATE.ui.supplierQuoteDrafts[pid] || {};
    const multiItem = !!(p.items && p.items.length>1);
    // Multi-item RFQs (fix42) get a real per-item unit price instead of one
    // blended number for the whole thing — itemPrices is what
    // supplierQuotePriceRows() and the PO PDF read to show each item's own
    // price, and productTotal (their sum) replaces the old unit*quantity
    // math below. unit itself becomes the average price per piece across
    // all items — a reasonable fallback for any legacy display that still
    // expects a single unitPrice, never used for the actual math.
    let unit, itemPrices, productTotal;
    if(multiItem){
      itemPrices = p.items.map((it,i)=>{
        const ip = parseFloat(draft.itemPrices?.[i])||0;
        return { unitPrice: ip, quantity: it.quantity||0, total: ip*(it.quantity||0) };
      });
      productTotal = itemPrices.reduce((s,ip)=>s+ip.total,0);
      const totalQty = itemPrices.reduce((s,ip)=>s+ip.quantity,0);
      unit = totalQty ? productTotal/totalQty : 0;
    } else {
      unit = parseFloat(f.get('unitPrice'))||0;
      itemPrices = [];
      productTotal = unit*p.quantity;
    }
    const shipping = parseFloat(f.get('shipping'))||0;
    const quotedTotal = productTotal+shipping;
    const leadTimeDays = parseInt(f.get('leadTimeDays'))||30;
    const paymentTerms = f.get('paymentTerms'), validity = f.get('validity'), notes = f.get('notes');
    const supplier = currentSupplier();
    let q = p.supplierQuotes.find(x=>x.supplierId===STATE.supplierId);
    const data = {supplierId:STATE.supplierId, status:'submitted', unitPrice:unit, itemPrices, shipping, quotedTotal,
      leadTimeDays, paymentTerms, validity, notes, documents:[], submittedAt:new Date('2026-09-08'), rating:supplier.rating, onTime:supplier.onTime};
    if(q) Object.assign(q,data); else p.supplierQuotes.push(data);
    if(p.status==='sourcing') p.status='sourcing';
    // Kept local-only, deliberately not persisted to the shared activity log —
    // it names the supplier, and that column is exactly what the client reads
    // directly (see the big confidentiality note above SUPABASE_URL).
    logActivity(p, supplier.name, 'Supplier submitted a quote.');
    if(!p.isDemo){
      const { error } = await sb.from('supplier_quotes').update({
        status:'submitted', unit_price:unit, item_prices:itemPrices, shipping, quoted_total:quotedTotal,
        lead_time_days:leadTimeDays, payment_terms:paymentTerms, validity, notes, submitted_at:new Date().toISOString(),
      }).eq('project_id', pid).eq('supplier_id', STATE.supplierId);
      if(error){ showToast(error.message); return false; }
    }
    delete STATE.ui.supplierQuoteDrafts[pid];
    showToast('Cotización enviada con éxito', 'success');
    navigate('#/supplier/quote/'+pid);
    return false;
  },
  // "First come, first served" — the database function itself re-checks
  // (atomically, via `where selected_supplier_id is null`) that nobody beat
  // this supplier to it; the error message below is exactly what comes back
  // when that race is lost, so there's nothing to pre-check client-side.
  async acceptTargetPrice(pid){
    const p = findProject(pid); if(!p) return;
    const { error } = await sb.rpc('supplier_accept_target_price', { p_project_id: pid });
    if(error){ showToast(error.message); await refreshRealProjects(); route(); return; }
    await refreshRealProjects();

  },
  // Declining isn't security-critical the way accepting is (nothing is
  // awarded, nothing to race) — a plain client-side update to this
  // supplier's own supplier_quotes row is enough; RLS already only lets a
  // supplier update their own row.
  async declineTargetPrice(pid){

      if(error){ showToast(error.message); return; }
    }
    showToast('Rechazaste este proyecto.', 'success');
    route();
  },

  /* ---- Status transitions ---- */
  async advanceStatus(pid, status){
    const p = findProject(pid); p.status = status;
    logActivity(p,'INNOUS', status==='under_review' ? 'RFQ reviewed and approved for sourcing.' : 'RFQ approved for supplier matching.');
    if(!p.isDemo){
      const { error } = await sb.from('projects').update({ status: p.status, activity: p.activity }).eq('id', p.id);
      if(error){ showToast(error.message); return; }
    }
    showToast('Estatus del RFQ actualizado');
    route();
  },
  // Every transition is a single click, except the one into "Shipped" —
  // that one is gated on a modal asking for the real carrier and tracking
  // number, since those are exactly what the client's notification and
  // Shipping card will show them (see supabase-fix25/26). Nothing gets
  // invented; INNOUS types in what's actually printed on the label.
  async advanceOrderStatus(pid){
    const p = findProject(pid);
    const idx = ORDER_STATUS_FLOW.indexOf(p.order.status);
    const next = ORDER_STATUS_FLOW[idx+1];
    if(!next) return;
    if(next==='shipped'){ App.openShipOrderModal(pid); return; } // that modal IS the confirmation — no need for a second one on top
    const isSupplier = STATE.role==='SUPPLIER';
    const label = orderStatusLabelFor(p, next, isSupplier);
    const sure = isSupplier
      ? confirm(`¿Confirmas que quieres marcar este pedido como "${label}"? Si te equivocas, podrás regresarlo después.`)
      : confirm(`¿Marcar este pedido como "${label}"? Si fue un error, podrás regresarlo después.`);
    if(!sure) return;
    await App._doAdvanceOrderStatus(pid, next);
  },
  // The mirror of advanceOrderStatus — undoes the LAST forward step only,
  // one at a time. Gated per role exactly the same way the forward button
  // already is (supplierNextOrderStatus/innousNextOrderStatus): whichever
  // side made a given transition is the one allowed to walk it back, so a
  // supplier can't undo INNOUS's shipping/delivery calls and vice versa.
  async revertOrderStatus(pid){
    const p = findProject(pid); if(!p || !p.order) return;
    const idx = ORDER_STATUS_FLOW.indexOf(p.order.status);
    if(idx<=0) return;
    const prev = ORDER_STATUS_FLOW[idx-1];
    const isSupplier = STATE.role==='SUPPLIER';
    const label = orderStatusLabelFor(p, prev, isSupplier);
    const sure = confirm(`¿Regresar este pedido a "${label}"? Esto deshace la última actualización de estatus.`);
    if(!sure) return;
    const wasShipped = p.order.status==='shipped';
    const wasCompleted = p.status==='completed';
    p.order.status = prev;
    if(p.order.milestones[idx]){ p.order.milestones[idx].done = false; p.order.milestones[idx].date = null; }
    if(wasCompleted){ p.status = 'in_production'; recalcSupplierMetrics(p.selectedSupplierId); }
    logActivity(p, isSupplier?supplierName(STATE.supplierId):'INNOUS', `Reverted status back to "${orderStatusLabelFor(p, prev)}".`);
    if(!p.isDemo){
      const { error: e1 } = await sb.from('orders').update({status: prev}).eq('project_id', pid);
      if(e1){ showToast(e1.message); return; }
      if(wasCompleted){
        const { error: e2 } = await sb.from('projects').update({status:'in_production'}).eq('id', pid);
        if(e2){ showToast(e2.message); return; }
        await persistSupplierMetrics(p.selectedSupplierId);
      }
      // The client already got a "your order shipped" notification for the
      // mistake being undone here — tell them so they don't go looking for
      // a package that, as far as they now know, hasn't actually left yet.
      if(wasShipped && isRealAccountId(p.customerId)){
        const pickup = isPickupOrder(p);
        const { error: e3 } = await sb.rpc('innous_send_notification', {
          p_user_ids: [p.customerId],
          p_title: `Update on order ${p.id}`,
          p_body: pickup
            ? `The pickup-ready notice for "${p.projectName}" was sent by mistake — it isn't actually ready yet and is back in ${orderStatusLabelFor(p, prev)}. We'll notify you again once it really is.`
            : `The shipping notice for "${p.projectName}" was sent by mistake — your order hasn't actually shipped yet and is back in ${orderStatusLabelFor(p, prev)}. We'll notify you again once it really ships.`,
          p_project_id: p.id,
        });
        if(e3) console.error('innous_send_notification (revert-shipped) failed', e3);
      }
    }
    showToast(`Pedido ${p.id} regresado a ${label}`, 'success');
    route();
  },
  // Branches entirely on delivery method: a Pickup order never has a
  // carrier or a tracking number — nothing is actually shipped, the
  // customer just comes to collect it — so that modal only asks for a
  // ready date. A Delivery order keeps asking for the real carrier/tracking
  // exactly as before.
  openShipOrderModal(pid){
    const p = findProject(pid); if(!p) return;
    const l = p.order.logistics;
    const etaVal = l.estimatedDelivery ? new Date(l.estimatedDelivery).toISOString().slice(0,10) : '';
    if(isPickupOrder(p)){
      openModal(`
        <div class="modal-header"><h3>Marcar como Listo para Recolección</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div class="field-hint" style="margin-bottom:12px;">Este cliente eligió Recolección — no hay envío que rastrear. Confirma la fecha lista y se le notifica para que venga a recogerlo.</div>
          <div class="form-group"><label class="field-label">Fecha Lista</label><input type="date" id="ship-eta" value="${etaVal}"></div>
          <div class="pricing-panel"><div class="pricing-row"><span>Ubicación de Recolección</span><span class="td-strong">${escAttr(l.origin||'—')}</span></div></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="App.confirmShipOrder('${pid}')"><i data-lucide="package-check"></i>Marcar como Listo y Notificar al Cliente</button>
        </div>
      `);
      return;
    }
    openModal(`
      <div class="modal-header"><h3>Marcar como Enviado</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="modal-body">
        <div class="field-hint" style="margin-bottom:12px;">Pon los datos reales del envío abajo — esto es exactamente lo que el cliente ve y usa para rastrear su pedido, y se le notifica en cuanto confirmes.</div>
        <div class="form-row">
          <div class="form-group"><label class="field-label">Transportista</label><input type="text" id="ship-carrier" placeholder="ej. FedEx Freight" value="${escAttr(l.carrier||'')}"></div>
          <div class="form-group"><label class="field-label">Número de Rastreo</label><input type="text" id="ship-tracking" placeholder="ej. 1Z999AA10123456784" value="${escAttr(l.tracking||'')}"></div>
        </div>
        <div class="form-group"><label class="field-label">Entrega Estimada</label><input type="date" id="ship-eta" value="${etaVal}"></div>
        <div class="pricing-panel"><div class="pricing-row"><span>Destino</span><span class="td-strong">${escAttr(l.destination)}</span></div></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="App.confirmShipOrder('${pid}')"><i data-lucide="truck"></i>Marcar como Enviado y Notificar al Cliente</button>
      </div>
    `);
  },
  async confirmShipOrder(pid){
    const p = findProject(pid); if(!p) return;
    const eta = document.getElementById('ship-eta').value;
    if(isPickupOrder(p)){
      if(eta) p.order.logistics.estimatedDelivery = new Date(eta+'T00:00:00');
      closeModal();
      await App._doAdvanceOrderStatus(pid, 'shipped', { estimatedDelivery: p.order.logistics.estimatedDelivery });
      return;
    }
    const carrier = document.getElementById('ship-carrier').value.trim();
    const tracking = document.getElementById('ship-tracking').value.trim();
    if(!carrier || !tracking){ showToast('El transportista y el número de rastreo son requeridos.'); return; }
    p.order.logistics.carrier = carrier;
    p.order.logistics.tracking = tracking;
    if(eta) p.order.logistics.estimatedDelivery = new Date(eta+'T00:00:00');
    closeModal();
    await App._doAdvanceOrderStatus(pid, 'shipped', { carrier, tracking, estimatedDelivery: p.order.logistics.estimatedDelivery });
  },
  async _doAdvanceOrderStatus(pid, next, shipLogistics){
    const p = findProject(pid);
    const idx = ORDER_STATUS_FLOW.indexOf(p.order.status);
    p.order.status = next;
    if(p.order.milestones[idx+1]){ p.order.milestones[idx+1].done = true; p.order.milestones[idx+1].date = new Date('2026-09-08'); }
    // Payment status is deliberately NOT touched here — production progress is the
    // supplier's call, billing/collection is INNOUS's (see App.setPaymentStatus).
    const justCompleted = next==='delivered';
    const justStarted = p.status==='awarded';
    if(justCompleted){ p.status='completed'; recalcSupplierMetrics(p.selectedSupplierId); }
    else if(justStarted) p.status='in_production';
    logActivity(p, supplierName(p.selectedSupplierId), `Production status updated to "${orderStatusLabelFor(p, next)}".`);
    if(!p.isDemo){
      const updateData = {status: next};
      if(shipLogistics){
        updateData.carrier = shipLogistics.carrier; updateData.tracking = shipLogistics.tracking;
        if(shipLogistics.estimatedDelivery) updateData.estimated_delivery = shipLogistics.estimatedDelivery.toISOString().slice(0,10);
      }
      const { error: e1 } = await sb.from('orders').update(updateData).eq('project_id', pid);
      if(e1){ showToast(e1.message); return; }
      if(justCompleted || justStarted){
        // Whichever role is advancing the order writes this — INNOUS always
        // can (its usual "for all"); the supplier can too, but only for its
        // own awarded project (see supabase-fix10-order-status.sql).
        const { error: e2 } = await sb.from('projects').update({status: p.status}).eq('id', pid);
        if(e2){ showToast(e2.message); return; }
      }
      if(justCompleted) await persistSupplierMetrics(p.selectedSupplierId);
      // The one moment the client needs an unmistakable heads-up mid-order:
      // their product is physically moving. Only INNOUS ever makes this
      // specific transition (see SUPPLIER_ORDER_STAGE_LIMIT — the supplier's
      // own "next status" never goes past quality_inspection), so this is
      // never fired from a supplier session.
      if(next==='shipped' && isRealAccountId(p.customerId)){
        const l = p.order.logistics;
        const pickup = isPickupOrder(p);
        const { error: e3 } = await sb.rpc('innous_send_notification', {
          p_user_ids: [p.customerId],
          p_title: pickup ? `Your order ${p.id} is ready for pickup` : `Your order ${p.id} has shipped`,
          p_body: pickup
            ? `${p.projectName} is ready for pickup at ${l.origin||'our facility'}. Ready as of: ${fmtDate(l.estimatedDelivery)}.`
            : `${p.projectName} is on its way via ${l.carrier||'our carrier'} — tracking #${l.tracking||'—'}, headed to ${l.destination}. Estimated delivery: ${fmtDate(l.estimatedDelivery)}.`,
          p_project_id: p.id,
        });
        if(e3) console.error('innous_send_notification (shipped) failed', e3);
      }
    }
    showToast(`Pedido ${p.id} actualizado a ${orderStatusLabelFor(p, next, true)}`, 'success');
    route();
  },
  async setPaymentStatus(pid, status){
    const p = findProject(pid);
    p.order.paymentStatus = status;
    logActivity(p, 'INNOUS', `Payment status updated to "${status}".`);
    if(!p.isDemo){
      const { error } = await sb.from('orders').update({payment_status: status}).eq('project_id', pid);
      if(error){ showToast(error.message); return; }
    }
    showToast(`Estatus de pago actualizado a ${status}`, 'success');
    route();
  },
  async setQualityStatus(pid, status){
    const p = findProject(pid);
    p.order.quality.status = status;
    if(status==='ncr_open'){
      p.order.quality.ncr = [{id:'NCR-'+Math.floor(Math.random()*900+100), issue:'Quality issue flagged by INNOUS', status:'Under Review'}];
    } else if(status==='approved'){
      p.order.quality.ncr = [];
    }
    logActivity(p, 'INNOUS', `Quality inspection ${status==='approved'?'approved':'rejected — NCR opened'}.`);
    recalcSupplierMetrics(p.selectedSupplierId);
    if(!p.isDemo){
      const { error } = await sb.from('orders').update({quality_status: p.order.quality.status, quality_ncr: p.order.quality.ncr}).eq('project_id', pid);
      if(error){ showToast(error.message); return; }
      await persistSupplierMetrics(p.selectedSupplierId);
    }
    showToast(status==='approved' ? 'Calidad aprobada' : 'Calidad rechazada — NCR abierto', status==='approved'?'success':undefined);
    route();
  },

  /* ---- Messaging ----
     Each person can have several NAMED chats going at once (see
     chatThread/entityThreads) — key is always
     '<client|supplier>:<their id>:<chat name>' (rest.join(':') below
     reconstructs the name even if it happens to contain a colon; ids never
     do). Real accounts write straight to messages_general (see
     supabase-fix34-named-chats-and-files.sql) and ping the other side via
     innous_send_notification / notify_innous (with a `link` back to this
     exact chat, so clicking the notice opens it — see the notif-menu
     rendering in renderShell), then re-fetch so the thread shows the row
     with its real id (see mergeMessages) instead of trusting a local
     optimistic copy. Guest/demo exploration (no real account yet) keeps a
     purely-local scripted reply — there's no real person on the far end of
     a demo conversation to actually notify. */
  // Goes through navigate() (a real URL change), not just a state mutation
  // + route() — otherwise switching chats never touches location.hash, so
  // it falls out of sync with the back/forward arrows and the browser's
  // own history, which is exactly what read as "glitchy" when clicking
  // between two or more chats.
  openInnousChatThread(key){
    const [type, id, ...rest] = key.split(':');
    navigate('#/innous/messages/'+type+'/'+id+'/'+encodeURIComponent(rest.join(':')||'General'));
  },
  // Opens (or starts) a chat from anywhere in the INNOUS portal — the "+ New
  // Chat" button on the Messages page, "Send Message" on a Customer/
  // Supplier's own detail page (name left blank -> "General"), or an
  // RFQ/Order page ("Message Customer/Supplier", name pre-filled with that
  // RFQ's id). A brand-new chat has no messages yet on either side — see
  // the activeChatKey-matching branch in ROUTES['innous/messages']'s thread
  // list for how it still shows up before the first message is sent.
  startChat(type, id, name){
    const threadName = (name||'').trim() || 'General';
    const key = type+':'+id+':'+threadName;
    STATE.ui.activeChatKey = key;
    closeModal();
    // INNOUS can open a chat with anyone by id; a client/supplier only ever
    // has one conversation partner (INNOUS), so their own Messages page
    // just takes the chat name.
    const path = STATE.role==='INNOUS' ? '#/innous/messages/'+type+'/'+id+'/'+encodeURIComponent(threadName)
      : STATE.role==='CLIENT' ? '#/client/messages/'+encodeURIComponent(threadName)
      : '#/supplier/messages/'+encodeURIComponent(threadName);
    navigate(path);
  },
  // "+ New Chat" — for INNOUS, picks who (customer or supplier) and names
  // it; for a client/supplier, it's always with INNOUS, just naming it.
  openNewChatModal(){
    if(STATE.role==='INNOUS'){
      openModal(`
        <div class="modal-header"><h3>Nuevo Chat</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div class="form-group"><label class="field-label">Con</label>
            <select id="new-chat-type" onchange="App.renderNewChatTargetOptions()"><option value="client">Cliente</option><option value="supplier">Proveedor</option></select>
          </div>
          <div class="form-group"><label class="field-label">Quién</label><select id="new-chat-target">${CUSTOMERS.map(c=>`<option value="${c.id}">${escAttr(c.company)} — ${escAttr(c.contact)}</option>`).join('') || '<option value="">Aún no hay clientes</option>'}</select></div>
          <div class="form-group"><label class="field-label">Nombre del chat</label><input type="text" id="new-chat-name" placeholder="ej. RFQ-2026-0004"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary" onclick="App.submitNewChat()"><i data-lucide="message-square-plus"></i>Iniciar Chat</button></div>
      `);
    } else {
      const es = STATE.role!=='CLIENT';
      openModal(`
        <div class="modal-header"><h3>${es?'Nuevo Chat':'New Chat'}</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div class="field-hint" style="margin-top:-4px;margin-bottom:10px;">${es?'Se abre con tu equipo de sourcing en INNOUS.':'Opens with your INNOUS project team.'}</div>
          <div class="form-group"><label class="field-label">${es?'Nombre del chat':'Chat name'}</label><input type="text" id="new-chat-name" placeholder="${es?'ej. RFQ-2026-0004':'e.g. RFQ-2026-0004'}"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary" onclick="App.submitNewChat('${es?'supplier':'client'}','${es?STATE.supplierId:STATE.clientId}')"><i data-lucide="message-square-plus"></i>${es?'Iniciar Chat':'Start Chat'}</button></div>
      `);
    }
  },
  renderNewChatTargetOptions(){
    const type = document.getElementById('new-chat-type').value;
    const opts = type==='client'
      ? CUSTOMERS.map(c=>`<option value="${c.id}">${escAttr(c.company)} — ${escAttr(c.contact)}</option>`)
      : SUPPLIERS.map(s=>`<option value="${s.id}">${escAttr(s.name)} — ${escAttr(s.contactName)}</option>`);
    document.getElementById('new-chat-target').innerHTML = opts.join('') || `<option value="">${type==='client'?'Aún no hay clientes':'Aún no hay proveedores'}</option>`;
  },
  submitNewChat(fixedType, fixedId){
    let type = fixedType, id = fixedId;
    if(!type){ type = document.getElementById('new-chat-type').value; id = document.getElementById('new-chat-target').value; }
    if(!id){ showToast('Elige primero con quién chatear.'); return; }
    const name = document.getElementById('new-chat-name').value;
    App.startChat(type, id, name);
  },
  pickChatFile(key){
    const id = STATE.role==='CLIENT' ? 'client-chat-file-input' : STATE.role==='SUPPLIER' ? 'supplier-chat-file-input' : 'innous-chat-file-input';
    document.getElementById(id)?.click();
  },
  stageChatFile(key, inputEl){
    const file = inputEl.files[0]; inputEl.value = '';
    if(!file) return;
    if(file.size > 25*1024*1024){ showToast('File is larger than 25 MB.'); return; }
    STATE.ui.chatFileDrafts[key] = file;
    route();
  },
  removeStagedChatFile(key){ delete STATE.ui.chatFileDrafts[key]; route(); },
  async openChatFile(path){
    if(!path) return;
    const { data, error } = await sb.storage.from('chat-files').createSignedUrl(path, 300);
    if(error || !data){ showToast('Could not open the file.'); return; }
    window.open(data.signedUrl, '_blank');
  },
  async sendChatMessage(key){
    const inputId = STATE.role==='CLIENT' ? 'client-chat-input' : STATE.role==='SUPPLIER' ? 'supplier-chat-input' : 'innous-chat-input';
    const input = document.getElementById(inputId); const text = input.value.trim();
    const file = STATE.ui.chatFileDrafts[key];
    if(!text && !file) return;
    const [ownerType, ownerId, ...rest] = key.split(':'); const threadName = rest.join(':') || 'General';
    const owner = ownerType==='client' ? CUSTOMERS.find(c=>c.id===ownerId) : SUPPLIERS.find(s=>s.id===ownerId);
    if(!owner){ showToast('This account no longer exists.'); route(); return; }
    input.value = ''; delete STATE.ui.chatFileDrafts[key];
    const fromRole = STATE.role==='CLIENT' ? 'client' : STATE.role==='SUPPLIER' ? 'supplier' : 'innous';
    // INNOUS is always a real account; whether THIS send hits the real
    // backend depends on whether the other side (the customer/supplier
    // being messaged) is real or just loaded example data. For a client or
    // supplier sending their own message, it depends on their own account.
    const isReal = fromRole==='innous' ? isRealAccountId(ownerId) : STATE.authMode==='account';
    if(isReal){
      let attachmentPath = null, attachmentName = null;
      if(file){
        const path = `${ownerType}/${ownerId}/${Date.now()}-${file.name}`;
        const { error: upErr } = await sb.storage.from('chat-files').upload(path, file);
        if(upErr){ showToast(upErr.message); return; }
        attachmentPath = path; attachmentName = file.name;
      }
      const { error } = await sb.from('messages_general').insert({ owner_type:ownerType, owner_id:ownerId, from_role:fromRole, text, thread_name:threadName, attachment_path:attachmentPath, attachment_name:attachmentName });
      if(error){ showToast(error.message); return; }
      const bodyPreview = text || (attachmentName ? `📎 ${attachmentName}` : '');
      const ownerName = ownerType==='client' ? owner.company : owner.name;
      await notifyOtherSideOfChat(fromRole, ownerType, ownerId, ownerName, threadName, bodyPreview);
      await refreshRealMessages();
      route();
    } else {
      chatThread(owner, threadName).push({from:fromRole, text, attachmentPath:null, attachmentName: file?file.name:null, ts:new Date()});
      route();
      if(fromRole!=='innous'){
        const reply = fromRole==='client' ? 'Thanks for the note — our team is on it and will follow up shortly.' : 'Entendido, gracias por la actualización.';
        setTimeout(()=>{ chatThread(owner, threadName).push({from:'innous', text:reply, ts:new Date()}); if(location.hash.includes('/messages')) route(); }, 900);
      }
    }
  },
  // "+" in the compose bar — share a quick-look card for an RFQ, Formal
  // Quote, or Purchase Order. Which types are even offered depends on WHO
  // this chat is with, never on who's sending: a client chat only ever
  // offers RFQ/Quote (never a Purchase Order — that would name the
  // supplier); a supplier chat only ever offers RFQ/Purchase Order (never
  // a Quote — that would show the client's price and INNOUS's margin).
  openShareCardModal(key){
    const [ownerType] = key.split(':');
    const es = STATE.role!=='CLIENT';
    openModal(`
      <div class="modal-header"><h3>${es?'Compartir':'Share'}</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="modal-body">
        <div class="form-group"><label class="field-label">${es?'Qué':'What'}</label>
          <select id="share-card-type" onchange="App.renderShareCardOptions('${key}')">
            <option value="rfq">RFQ</option>
            ${ownerType==='client' ? `<option value="quote">${es?'Cotización Formal':'Formal Quote'}</option>` : `<option value="po">${es?'Orden de Compra':'Purchase Order'}</option>`}
          </select>
        </div>
        <div class="form-group"><label class="field-label">${es?'Cuál':'Which one'}</label><select id="share-card-project"></select></div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="App.submitShareCard('${key}')"><i data-lucide="share-2"></i>${es?'Compartir':'Share'}</button></div>
    `);
    App.renderShareCardOptions(key);
  },
  renderShareCardOptions(key){
    const [ownerType, ownerId] = key.split(':');
    const cardType = document.getElementById('share-card-type').value;
    const list = ownerType==='client'
      ? PROJECTS.filter(p=>p.customerId===ownerId && (cardType!=='quote' || p.order))
      : PROJECTS.filter(p=>p.invitedSupplierIds.includes(ownerId) && (cardType!=='po' || (p.order && p.selectedSupplierId===ownerId && p.innousAuthorizedAt)));
    document.getElementById('share-card-project').innerHTML = list.map(p=>`<option value="${p.id}">${p.id} — ${escAttr(p.projectName)}</option>`).join('') || `<option value="">${STATE.role!=='CLIENT'?'Aún no hay ninguno disponible':'None available yet'}</option>`;
  },
  submitShareCard(key){
    const cardType = document.getElementById('share-card-type').value;
    const projectId = document.getElementById('share-card-project').value;
    if(!projectId){ showToast(STATE.role!=='CLIENT'?'Aún no hay nada que compartir.':'Nothing to share yet.'); return; }
    App.sendChatCard(key, cardType, projectId);
  },
  async sendChatCard(key, cardType, projectId){
    const [ownerType, ownerId, ...rest] = key.split(':'); const threadName = rest.join(':') || 'General';
    const owner = ownerType==='client' ? CUSTOMERS.find(c=>c.id===ownerId) : SUPPLIERS.find(s=>s.id===ownerId);
    if(!owner) return;
    closeModal();
    const fromRole = STATE.role==='CLIENT' ? 'client' : STATE.role==='SUPPLIER' ? 'supplier' : 'innous';
    const isReal = fromRole==='innous' ? isRealAccountId(ownerId) : STATE.authMode==='account';
    const label = cardType==='rfq' ? 'RFQ' : cardType==='quote' ? 'Formal Quote' : 'Purchase Order';
    if(isReal){
      const { error } = await sb.from('messages_general').insert({ owner_type:ownerType, owner_id:ownerId, from_role:fromRole, text:'', thread_name:threadName, card_type:cardType, card_project_id:projectId });
      if(error){ showToast(error.message); return; }
      const ownerName = ownerType==='client' ? owner.company : owner.name;
      await notifyOtherSideOfChat(fromRole, ownerType, ownerId, ownerName, threadName, `📋 Shared ${label} ${projectId}`);
      await refreshRealMessages();
      route();
    } else {
      chatThread(owner, threadName).push({from:fromRole, text:'', cardType, cardProjectId:projectId, ts:new Date()});
      route();
    }
  },
  async deleteChat(type, id, threadName){
    const owner = type==='client' ? CUSTOMERS.find(c=>c.id===id) : SUPPLIERS.find(s=>s.id===id);
    if(!owner) return;
    if(!confirm(`¿Eliminar el chat "${threadName}"? Esto no se puede deshacer.`)) return;
    if(isRealAccountId(id)){
      const { error } = await sb.from('messages_general').delete().eq('owner_type', type).eq('owner_id', id).eq('thread_name', threadName);
      if(error){ showToast(error.message); return; }
    }
    if(owner.chats) delete owner.chats[threadName];
    const key = type+':'+id+':'+threadName;
    if(STATE.ui.activeChatKey===key) STATE.ui.activeChatKey = null;
    showToast('Chat eliminado', 'success');
    navigate(STATE.role==='INNOUS' ? '#/innous/messages' : STATE.role==='CLIENT' ? '#/client/messages' : '#/supplier/messages');
  },
};

document.addEventListener('click', ()=>{
  const m=document.getElementById('role-menu'); if(m) m.classList.remove('open');
  const n=document.getElementById('notif-menu'); if(n) n.classList.remove('open');
});

/* ---------- Init ---------- */
// This is a real portal, not a demo: it starts genuinely empty (no pre-seeded
// customers/suppliers/RFQs). INNOUS can optionally load a set of example data
// to explore the platform's full richness — see App.loadExampleData on the
// Settings page — which persists via this flag until explicitly cleared.
if(localStorage.getItem('innous_demo_loaded')==='1'){
  buildProjects();
} else {
  CUSTOMERS.length = 0;
  SUPPLIERS.length = 0;
  PROJECTS = [];
}
// Real accounts, their customer/supplier records, and their RFQs/orders always
// persist on top of whichever base above — this is what makes them survive a
// refresh instead of only the currently-logged-in account's own record.
loadRealData();
window.addEventListener('hashchange', ()=>{ if(STATE.authMode!=='guest') route(); });
let booted = false;
/* A slow or dropped connection to Supabase used to leave the page stuck
   totally blank forever (both #auth-root and #app-shell start hidden, and
   nothing ever un-hides them if the request never resolves). Race every
   startup network call against a timeout, and show something — a spinner,
   then a "this is slow" note, then a real error with a retry button —
   instead of silence. */
function hideBootLoading(){ document.getElementById('boot-loading')?.remove(); }
function showBootError(msg){
  const el = document.getElementById('boot-loading'); if(!el) return;
  el.innerHTML = `
    <div style="font-family:'Ubuntu',sans-serif;font-weight:700;color:#18181B;font-size:14px;text-align:center;max-width:320px;padding:0 20px;line-height:1.5;">${msg}</div>
    <button onclick="location.reload()" style="padding:10px 22px;border-radius:9px;border:1px solid #D4D4D8;background:#fff;font-weight:600;font-size:13px;cursor:pointer;">Reintentar</button>
  `;
}
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout:'+label)), ms)),
  ]);
}
async function boot(){
  if(booted) return; booted = true;
  const slowTimer = setTimeout(()=>{ const t=document.getElementById('boot-loading-text'); if(t) t.textContent='Esto está tardando más de lo normal…'; }, 4000);
  try{
    const { data: { session } } = await withTimeout(sb.auth.getSession(), 10000, 'session');
    if(session && session.user){
      await withTimeout(enterAppAsUser(session.user), 15000, 'enterApp');
    } else {
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('auth-root').style.display = '';
      renderAuthRoot();
    }
    clearTimeout(slowTimer);
    hideBootLoading();
  }catch(err){
    clearTimeout(slowTimer);
    console.error('boot failed', err);
    showBootError('No se pudo conectar con el servidor. Revisa tu conexión a internet e intenta de nuevo.');
  }
  lucide.createIcons();
}
window.addEventListener('DOMContentLoaded', boot);
if(document.readyState!=='loading'){ boot(); }

</script>
