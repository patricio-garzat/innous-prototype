function supplierMatchingSection(p){
  // Only relevant while INNOUS could still be inviting suppliers — once the RFQ
  // has moved into comparing/shortlisting quotes (or further), this no longer
  // applies. A supplier already invited (whether they've quoted yet or not) is
  // never shown here again — there's nothing left to "recommend".
  if(!['under_review','sourcing'].includes(p.status)) return '';
  const notYetInvited = s => !p.invitedSupplierIds.includes(s.id);
  const eligible = SUPPLIERS.filter(s=>s.capabilities.includes(p.process) && notYetInvited(s));
  const candidates = eligible.length ? eligible : SUPPLIERS.filter(notYetInvited);
  if(!candidates.length) return p.invitedSupplierIds.length ? `<div class="card card-pad" style="margin-bottom:20px;"><div class="section-title">Recommended Suppliers</div><div class="section-sub">Every verified supplier for this process has already been invited.</div></div>` : '';
  const selected = STATE.ui.selectedInviteSuppliers;
  const already = p.invitedSupplierIds.length;
  return `
  <div class="card card-pad" style="margin-bottom:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div><div class="section-title">Recommended Suppliers</div><div class="section-sub">Matched by manufacturing process, capacity and quality history.${already?` ${already} already invited.`:''}</div></div>
      <div style="font-size:13px;font-weight:600;">${selected.length} suppliers selected</div>
    </div>
    <div class="grid grid-3">
      ${candidates.map(s=>supplierMatchCard(s, selected.includes(s.id))).join('')}
    </div>
    <hr class="divider">
    <div style="display:flex;justify-content:flex-end;">
      <button class="btn btn-primary" ${selected.length?'':'disabled'} onclick="App.sendRfqToSuppliers('${p.id}')"><i data-lucide="send"></i>Send RFQ to ${selected.length||''} Supplier${selected.length===1?'':'s'}</button>
    </div>
  </div>`;
}
function supplierMatchCard(s, isSelected){
  const isNew = s.projects===0 && s.rating===0;
  return `
  <div class="supplier-card ${isSelected?'selected':''}">
    <div class="supplier-card-top">
      <div style="display:flex;gap:10px;"><div class="supplier-avatar">${initials(s.name)}</div><div><div style="font-weight:700;font-size:13.5px;">${s.name}</div><div class="td-sub">${s.city}</div></div></div>
      ${isNew?'<span class="badge badge-blue">New</span>':''}
    </div>
    <div class="cap-list">${s.capabilities.map(c=>`<span class="tag">${c}</span>`).join('')}${s.certs.map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    <div class="td-sub" style="margin:8px 0;">${s.machines.join(' · ')||'No machines listed yet'}</div>
    ${isNew ? `<div class="field-hint" style="margin:8px 0;">No completed orders yet — rating, on-time % and quality % will populate after their first delivery.</div>` : `
    <div class="mini-stat-grid">
      <div class="mini-stat"><div class="mini-stat-val">${s.onTime}%</div><div class="mini-stat-label">On-Time</div></div>
      <div class="mini-stat"><div class="mini-stat-val">${s.rating}</div><div class="mini-stat-label">Rating</div></div>
      <div class="mini-stat"><div class="mini-stat-val">${s.projects}</div><div class="mini-stat-label">Projects</div></div>
    </div>`}
    <div class="td-sub" style="margin-bottom:10px;">${s.capacity||'Capacity not set'}</div>
    <button class="btn ${isSelected?'btn-primary':'btn-secondary'} btn-block btn-sm" onclick="App.toggleInviteSupplier('${s.id}')">${isSelected?'<i data-lucide=\'check\'></i>Selected':'Invite to RFQ'}</button>
  </div>`;
}
function supplierResponsesSection(p){
  return `
  <div class="card card-pad" style="margin-bottom:20px;">
    <div class="section-title">Supplier Responses</div>
    <div class="section-sub">${p.invitedSupplierIds.length} suppliers invited</div>
    <div class="grid grid-4">
      ${p.invitedSupplierIds.map((sid,i)=>{
        const q = p.supplierQuotes.find(x=>x.supplierId===sid);

      }).join('')}

function markupKey(pid,sid){ return pid+'::'+sid; }
function getMarkup(pid,sid){ const k=markupKey(pid,sid); if(STATE.ui.markupDrafts[k]===undefined) STATE.ui.markupDrafts[k]=STATE.settings.defaultMarkupPct; return STATE.ui.markupDrafts[k]; }

function quoteComparisonSection(p){
  const submitted = p.supplierQuotes.filter(q=>q.status==='submitted');
  if(!submitted.length) return '';
  const shortlisted = new Set(p.shortlist.map(s=>s.supplierId));
  return `
  <div class="card card-pad" style="margin-bottom:20px;">
    <div class="section-title">Compare Supplier Quotes</div>
    <div class="section-sub">Supplier pricing is confidential — only visible within the INNOUS portal.</div>

    <table class="data-table comparison-table"><thead><tr>
      <th>Supplier</th><th>Unit Price</th><th title="Tooling / Setup / Shipping">Extras</th><th>Total Cost</th><th>Lead</th><th>Terms</th><th>Markup</th><th>Cust. Price</th><th></th>
    </tr></thead><tbody>
      ${submitted.map(q=>{
        const supplier = SUPPLIERS.find(s=>s.id===q.supplierId);
        const markup = getMarkup(p.id,q.supplierId);
        const customerPrice = q.quotedTotal*(1+markup/100);
        const already = shortlisted.has(q.supplierId);
        return `<tr>
          <td class="td-strong">${supplier?supplier.name:'Deleted Supplier'}<div class="td-sub">${supplier?`${supplier.city} · ${supplier.rating}★`:'—'}</div></td>
          <td>${fmtMoney2(q.unitPrice)}</td>
          <td class="td-sub" style="line-height:1.5;">T ${fmtMoney(q.tooling)}<br>S ${fmtMoney(q.setup)}<br>Sh ${q.shipping?fmtMoney(q.shipping):'Incl.'}</td>
          <td class="td-strong">${fmtMoney(q.quotedTotal)}</td>
          <td>${q.leadTimeDays}d</td>
          <td class="td-sub">${q.paymentTerms}</td>
          <td><input type="number" value="${markup}" min="0" max="100" style="width:42px;padding:5px 4px;" onchange="App.setMarkup('${p.id}','${q.supplierId}', this.value)">%</td>
          <td class="td-strong">${fmtMoney(customerPrice)}</td>
          <td>${already?`<span class="badge badge-green">Shortlisted</span>`:`<button class="btn btn-secondary btn-sm" ${p.shortlist.length>=5?'disabled':''} onclick="App.addToShortlist('${p.id}','${q.supplierId}')">Add</button>`}</td>
        </tr>`;
      }).join('')}
    </tbody></table>
    </div>
    ${p.shortlist.length ? shortlistPreview(p) : ''}
    <hr class="divider">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="td-sub">${p.shortlist.length} of 5 selected for customer shortlist</div>
      <button class="btn btn-primary" ${p.shortlist.length?'':'disabled'} onclick="App.sendQuotesToCustomer('${p.id}')"><i data-lucide="send"></i>Send Quotes to Customer</button>
    </div>
  </div>`;
}
function shortlistPreview(p){
  return `
  <div style="margin:16px 0;">
    <div class="info-item-label" style="margin-bottom:8px;">Customer Shortlist Preview</div>
    <div class="grid grid-5">
      ${p.shortlist.map(s=>`
        <div class="card card-pad" style="box-shadow:none;">

function qualityBlock(p){
  const q = p.order.quality;
  const statusMap = {pending:['badge-gray','Pending'],approved:['badge-green','Approved'],ncr_open:['badge-red','NCR Open']};
  const [cls,label] = statusMap[q.status]||['badge-gray',q.status];
  return `
  <div class="info-grid" style="grid-template-columns:1fr 1fr;margin-top:8px;">
    ${infoItem('Inspection Required', q.inspectionRequired?'Yes':'No')}
    ${infoItem('Inspection Status', `<span class="badge ${cls}">${label}</span>`)}

  <div class="info-item-label" style="margin-top:12px;">Documents &amp; Certificates</div>
  <div class="file-list" style="margin-top:8px;">${[...q.documents,...q.certificates].map(d=>`<div class="file-chip"><div class="fc-icon" style="color:#B91C1C;background:#B91C1C18;">PDF</div><span class="fc-name">${d}</span></div>`).join('')}</div>

  ${q.status!=='approved' ? `<button class="btn btn-secondary btn-sm" style="margin-top:12px;margin-right:8px;color:var(--success);" onclick="App.setQualityStatus('${p.id}','approved')"><i data-lucide="check-circle-2"></i>Approve Quality</button>` : ''}
  ${q.status!=='ncr_open' ? `<button class="btn btn-secondary btn-sm" style="margin-top:12px;color:var(--danger);" onclick="App.setQualityStatus('${p.id}','ncr_open')"><i data-lucide="alert-triangle"></i>Reject — Open NCR</button>` : `<button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="App.setQualityStatus('${p.id}','approved')"><i data-lucide="check"></i>Resolve NCR &amp; Approve</button>`}

}
function logisticsBlock(p){

/* ---- INNOUS Analytics ---- */
ROUTES['innous/analytics'] = function(){
  const withOrder = PROJECTS.filter(p=>p.order);
  const thisMonth = PROJECTS.filter(p=> new Date(p.createdAt) > daysFromNow(-30)).length;
  const awarded = PROJECTS.filter(p=>p.order).length;
  const totalShortlisted = PROJECTS.filter(p=>p.shortlist.length>0).length;
  const winRate = totalShortlisted? Math.round(awarded/totalShortlisted*100) : 0;
  const avgMarkup = withOrder.length? (withOrder.reduce((s,p)=>s+p.order.markupPct,0)/withOrder.length).toFixed(1) : 0;
  const avgValue = withOrder.length? withOrder.reduce((s,p)=>s+p.order.customerPrice,0)/withOrder.length : 0;
  const revenue = withOrder.reduce((s,p)=>s+p.order.customerPrice,0);
  const margin = withOrder.reduce((s,p)=>s+(p.order.customerPrice-p.order.supplierCost),0);

  const custCounts = {}; withOrder.forEach(p=>{ custCounts[p.customerId]=(custCounts[p.customerId]||0)+p.order.customerPrice; });
  const topCustomers = Object.entries(custCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCust = topCustomers.length? topCustomers[0][1] : 1;

  const supCounts = {}; withOrder.forEach(p=>{ supCounts[p.selectedSupplierId]=(supCounts[p.selectedSupplierId]||0)+1; });
  const topSuppliers = Object.entries(supCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxSup = topSuppliers.length? topSuppliers[0][1] : 1;

  const procCounts = {}; PROJECTS.forEach(p=>{ procCounts[p.process]=(procCounts[p.process]||0)+1; });
  const topProcess = Object.entries(procCounts).sort((a,b)=>b[1]-a[1]);
  const maxProc = topProcess.length? topProcess[0][1] : 1;

  return `
  <div class="content-inner">
    <div class="page-header"><div><div class="page-title">Analytics</div><div class="page-subtitle">Platform performance across sourcing and fulfillment</div></div></div>
    <div class="grid grid-4" style="margin-bottom:16px;">
      ${kpiCard('RFQs This Month', thisMonth, 'new requests submitted','file-text')}
      ${kpiCard('Win Rate', winRate+'%', 'shortlist → awarded order','target')}
      ${kpiCard('Avg. Markup', avgMarkup+'%', 'across all awarded orders','percent')}
      ${kpiCard('Avg. Project Value', fmtMoney(avgValue), 'per awarded order','dollar-sign')}
    </div>
    <div class="grid grid-2" style="margin-bottom:16px;">
      ${kpiCard('Revenue', fmtMoney(revenue), 'across active + completed orders','trending-up')}
      ${kpiCard('Gross Margin', fmtMoney(margin), (revenue?(margin/revenue*100).toFixed(1):0)+'% blended margin','wallet')}
    </div>
    <div class="grid grid-2">

/* ---- INNOUS Messages ---- */
ROUTES['innous/messages'] = function(){
  const threads = [];
  PROJECTS.forEach(p=>{
    if(p.chatClient && p.chatClient.length) threads.push({type:'client', pid:p.id, name:customerName(p.customerId), proj:p.projectName, key:'c:'+p.id});
    Object.keys(p.chatSupplier||{}).forEach(sid=>{ if(p.chatSupplier[sid].length) threads.push({type:'supplier', pid:p.id, sid, name:supplierName(sid), proj:p.projectName, key:'s:'+p.id+':'+sid}); });
  });
  // General (not tied to a specific RFQ) conversations — either already has messages,
  // or is the one just opened via "Send Message" on a Customer/Supplier detail page.
  CUSTOMERS.forEach(c=>{ const key='gc:'+c.id; if((c.generalChat&&c.generalChat.length) || STATE.ui.activeChatKey===key) threads.push({type:'client-general', pid:null, name:c.company, proj:'General', key}); });
  SUPPLIERS.forEach(s=>{ const key='gs:'+s.id; if((s.generalChat&&s.generalChat.length) || STATE.ui.activeChatKey===key) threads.push({type:'supplier-general', pid:null, name:s.name, proj:'General', key}); });
  if(!STATE.ui.activeChatKey && threads.length) STATE.ui.activeChatKey = threads[0].key;
  const active = threads.find(t=>t.key===STATE.ui.activeChatKey) || threads[0];
  const isSupplierSide = active && (active.type==='supplier' || active.type==='supplier-general');
  const p = active && active.pid ? findProject(active.pid) : null;
  const msgs = active ? (
    active.key.startsWith('gc:') ? chatOf(CUSTOMERS.find(c=>c.id===active.key.slice(3))) :
    active.key.startsWith('gs:') ? chatOf(SUPPLIERS.find(s=>s.id===active.key.slice(3))) :
    (active.type==='client' ? p.chatClient : p.chatSupplier[active.sid])
  ) : [];
  return `
  <div class="content-inner">
    <div class="page-header"><div><div class="page-title">Messages</div><div class="page-subtitle">Customer and supplier conversations. INNOUS mediates all communication.</div></div></div>
    <div class="chat-panel">
      <div class="chat-list">
        ${threads.map(t=>`<div class="chat-list-item ${active&&active.key===t.key?'active':''}" onclick="App.openInnousChat('${t.key}')">
          <div class="avatar" style="background:${t.type.startsWith('client')?'var(--accent)':'var(--ink)'};">${initials(t.name)}</div>
          <div><div style="font-weight:600;font-size:13px;">${t.name}</div><div class="td-sub">${t.type.startsWith('client')?'Customer':'Supplier'} · ${t.proj}</div></div>
        </div>`).join('') || emptyState('message-square','No conversations yet','')}
      </div>
      <div class="chat-thread">
        ${active? `
        <div class="chat-thread-header"><div style="font-weight:700;">${active.name}</div><div class="td-sub">${isSupplierSide?'Supplier':'Customer'} · ${active.proj}${active.pid?' · '+active.pid:''}</div></div>
        <div class="chat-messages">${msgs.map(m=>`<div class="chat-bubble ${m.from==='innous'?'out':'in'}">${m.text}<div class="chat-bubble-meta">${m.from==='innous'?'INNOUS':active.name} · ${timeAgo(m.ts)}</div></div>`).join('') || `<div class="td-sub" style="margin:auto;">No messages yet — say hello.</div>`}</div>
        <div class="chat-input-row"><input type="text" placeholder="Message ${active.name}..." onkeydown="if(event.key==='Enter')App.sendInnousMessage('${active.key}')" id="innous-chat-input"><button class="btn btn-primary" onclick="App.sendInnousMessage('${active.key}')"><i data-lucide="send"></i></button></div>
        ` : emptyState('message-square','No conversations yet','')}
      </div>
    </div>
  </div>`;
};

/* =====================================================================
   APP ACTIONS (global handlers used by inline onclick/onsubmit)
   ===================================================================== */
const App = {
  /* ---- Auth: landing / signup / login ---- */
  goToLogin(){ STATE.authView='login'; renderAuthRoot(); },
  goToSignup(){ STATE.authView='role-pick'; renderAuthRoot(); },
  backToLanding(){ STATE.authView='landing'; STATE.signupRole=null; renderAuthRoot(); },
  pickSignupRole(role){ STATE.signupRole=role; STATE.authView='signup'; renderAuthRoot(); },
  async submitSignup(e){
    e.preventDefault();
    const f = new FormData(e.target);
    const role = STATE.signupRole; // always CLIENT or SUPPLIER — the role picker never offers INNOUS
    const es = role==='SUPPLIER';
    const email = f.get('email').trim().toLowerCase();
    const password = f.get('password'), password2 = f.get('password2');
    if(password!==password2){ showToast(es?'Las contraseñas no coinciden':'Passwords do not match'); return false; }
    if(password.length<6){ showToast(es?'La contraseña debe tener al menos 6 caracteres':'Password must be at least 6 characters'); return false; }
    if(es && f.getAll('capabilities').length===0){ showToast('Selecciona al menos un servicio que ofreces'); return false; }
    const submitBtn = e.target.querySelector('button[type=submit]'); if(submitBtn) submitBtn.disabled = true;
    try{
      const { data, error } = await withTimeout(sb.auth.signUp({ email, password }), 12000, 'signup');
      if(error || !data.user){
        showToast(error?.message || (es?'No se pudo crear la cuenta':'Could not create account'));
        if(submitBtn) submitBtn.disabled = false;
        return false;
      }
      const cityState = `${f.get('city').trim()}, ${f.get('state').trim()}`;
      const { error: profileErr } = await sb.from('profiles').insert({ user_id: data.user.id, role });
      if(profileErr){ showToast(profileErr.message); if(submitBtn) submitBtn.disabled=false; return false; }
      if(role==='CLIENT'){
        await sb.from('customers').insert({
          user_id: data.user.id, company: f.get('company').trim(), contact: f.get('contact').trim(), email,
          phone: f.get('phone').trim(), city: cityState, industry: f.get('industry'),
        });
      } else {
        await sb.from('suppliers').insert({
          user_id: data.user.id, name: f.get('company').trim(), contact_name: f.get('contact').trim(), email,
          phone: f.get('phone').trim(), city: cityState,
          capabilities: f.getAll('capabilities'), certs: f.getAll('certs'),
          years_operating: parseInt(f.get('yearsOperating'),10)||0, operators: parseInt(f.get('operators'),10)||0,
        });
      }
      await withTimeout(enterAppAsUser(data.user), 15000, 'enterApp');
      showToast(es?'Cuenta creada':'Account created', 'success');
      App.startTour();
    }catch(err){
      console.error('submitSignup failed', err);
      showToast(es?'No se pudo conectar. Intenta de nuevo.':'Could not connect. Please try again.');
      if(submitBtn) submitBtn.disabled = false;
    }
    return false;
  },
  async submitLogin(e){
    e.preventDefault();
    const f = new FormData(e.target);
    const email = f.get('email').trim().toLowerCase();
    const password = f.get('password');
    const submitBtn = e.target.querySelector('button[type=submit]'); if(submitBtn) submitBtn.disabled = true;
    try{
      const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password }), 12000, 'login');
      if(error || !data.user){ showToast('Correo o contraseña incorrectos'); if(submitBtn) submitBtn.disabled=false; return false; }
      await withTimeout(enterAppAsUser(data.user), 15000, 'enterApp');
      showToast('Welcome back', 'success');
    }catch(err){
      console.error('submitLogin failed', err);
      showToast('No se pudo conectar. Intenta de nuevo.');
      if(submitBtn) submitBtn.disabled = false;
    }
    return false;
  },
  async logOut(){
    await sb.auth.signOut();
    STATE.authMode='guest'; STATE.authView='landing'; STATE.signupRole=null;
    // Clear the hash so a different person logging in afterward on this same
    // tab/computer (e.g. a shared office machine) always lands on their own
    // home page, instead of accidentally inheriting whatever page the
    // previous person had open — enterAppAsUser() now preserves an existing
    // hash on login so refresh doesn't bounce people to Overview, so this is
    // what keeps that safe for a logout → different login on the same tab.
    history.replaceState(null,'',location.pathname+location.search);
    document.getElementById('app-shell').style.display='none';
    document.getElementById('auth-root').style.display='';
    renderAuthRoot();
  },
  clearExampleData(){
    if(!confirm('This permanently clears every example customer, supplier and RFQ, plus any test accounts created on this browser. The platform will run on real accounts only. Continue?')) return;
    localStorage.removeItem('innous_demo_loaded');
    localStorage.removeItem('innous_accounts');
    localStorage.removeItem('innous_session');
    localStorage.removeItem('innous_deleted_demo');
    clearRealData();
    location.reload();
  },
  loadExampleData(){
    if(!confirm('Load a set of example customers, suppliers and RFQs? This also clears any real test accounts created on this browser.')) return;
    localStorage.setItem('innous_demo_loaded','1');
    localStorage.removeItem('innous_accounts');
    localStorage.removeItem('innous_session');
    localStorage.removeItem('innous_deleted_demo');
    clearRealData();
    location.reload();
  },
  setDraftMarkup(pct){ STATE.ui.settingsDraft.defaultMarkupPct = pct; route(); },
  saveInnousSettings(){
    STATE.settings = { legalName:STATE.ui.settingsDraft.legalName.trim()||DEFAULT_SETTINGS.legalName, region:STATE.ui.settingsDraft.region.trim()||DEFAULT_SETTINGS.region, defaultMarkupPct:STATE.ui.settingsDraft.defaultMarkupPct, notif:{...STATE.ui.settingsDraft.notif} };
    saveSettings(STATE.settings);
    showToast('Settings saved', 'success');
    route();
  },
  /* ---- Delete a customer or supplier account (INNOUS only) ----
     Revokes login access and removes their profile. Past RFQs/orders are
     kept as historical records rather than silently erased — they just
     display as "Deleted Customer"/"Deleted Supplier" from then on (see
     customerName()/supplierName()), the same way a real ledger wouldn't
     un-happen a completed order just because the account was closed. */
  async deleteCustomer(id){
    const c = CUSTOMERS.find(x=>x.id===id); if(!c) return;
    const proj = PROJECTS.filter(p=>p.customerId===id);
    const active = proj.filter(p=>['awarded','in_production'].includes(p.status)).length;
    let msg = `Permanently delete the account for "${c.company}"? They will no longer be able to log in.`;
    if(proj.length) msg += ` They have ${proj.length} RFQ${proj.length===1?'':'s'} on record${active?` (${active} still active)`:''} — those stay in the system for history, but will show as "Deleted Customer".`;
    if(!confirm(msg)) return;
    CUSTOMERS.splice(CUSTOMERS.indexOf(c),1);
    if(isRealAccountId(id)){
      // Runs a database function that removes their profile/customer rows AND
      // the underlying login credential itself — so the email is actually
      // free to sign up again, not just locked out forever. The function
      // does the privileged part server-side; this app never holds the key
      // that would otherwise be needed for that.
      const { error } = await sb.rpc('innous_delete_account', { p_user_id: id });
      if(error){ showToast(error.message); return; }
    } else { const ids=loadDeletedDemoIds(); if(!ids.includes(id)){ ids.push(id); saveDeletedDemoIds(ids); } } // example (non-account) customer — remember so it stays gone after a refresh
    showToast('Customer account deleted', 'success');
    navigate('#/innous/customers');
  },
  async deleteSupplier(id){
    const s = SUPPLIERS.find(x=>x.id===id); if(!s) return;
    const proj = PROJECTS.filter(p=>p.invitedSupplierIds.includes(id));
    const active = proj.filter(p=>p.selectedSupplierId===id && ['awarded','in_production'].includes(p.status)).length;
    let msg = `Permanently delete the account for "${s.name}"? They will no longer be able to log in.`;
    if(proj.length) msg += ` They're on ${proj.length} RFQ${proj.length===1?'':'s'} on record${active?` (${active} still active)`:''} — those stay in the system for history, but will show as "Deleted Supplier".`;
    if(!confirm(msg)) return;
    SUPPLIERS.splice(SUPPLIERS.indexOf(s),1);
    if(isRealAccountId(id)){
      const { error } = await sb.rpc('innous_delete_account', { p_user_id: id });
      if(error){ showToast(error.message); return; }
    } else { const ids=loadDeletedDemoIds(); if(!ids.includes(id)){ ids.push(id); saveDeletedDemoIds(ids); } } // example (non-account) supplier — remember so it stays gone after a refresh
    showToast('Supplier account deleted', 'success');
    navigate('#/innous/suppliers');
  },
  /* Unlike deleting a customer/supplier account, this really does erase the
     RFQ — there's no "keep it for history" case here, since an RFQ with no
     one left to attribute it to (its customer already deleted) is exactly
     the clutter this exists to clean up. Real RFQs cascade-delete their
     invitations/quotes/order/messages in the database automatically. */
  async deleteRfq(id){
    const p = findProject(id); if(!p) return;
    if(!confirm(`Permanently delete RFQ ${p.id} ("${p.projectName}")? This can't be undone.`)) return;
    PROJECTS.splice(PROJECTS.indexOf(p),1);
    if(!p.isDemo){
      const { error } = await sb.from('projects').delete().eq('id', id);
      if(error){ showToast(error.message); return; }
    }
    showToast('RFQ deleted', 'success');
    navigate('#/innous/rfqs');
  },

  /* ---- Post-signup mini tour ---- */
  startTour(){
    STATE.ui.tourStep = 0;
    openModal(tourModalHtml());
  },
  tourNext(){ STATE.ui.tourStep++; document.querySelector('.modal').innerHTML = tourModalHtml(); lucide.createIcons(); },
  tourBack(){ STATE.ui.tourStep--; document.querySelector('.modal').innerHTML = tourModalHtml(); lucide.createIcons(); },
  tourSkip(){ closeModal(); },
  tourFinish(ctaPath){ closeModal(); navigate(ctaPath); },

  goHome(e){
    if(e) e.preventDefault();
    const home = STATE.role==='CLIENT'?'#/client/dashboard':STATE.role==='SUPPLIER'?'#/supplier/dashboard':'#/innous/overview';
    navigate(home);
    return false;
  },
  toggleSidebar(forceClose){
    const sb = document.getElementById('sidebar'), bd = document.getElementById('sidebar-backdrop');
    if(forceClose===true){ sb.classList.remove('open'); bd.classList.remove('open'); return; }

  /* ---- 1:1 photo cropper (pure canvas, no dependencies) ---- */
  openCropModal(dataUrl){
    const es = STATE.role==='SUPPLIER';
    STATE.ui.cropState = {scale:1, x:0, y:0, coverW:0, coverH:0, dataUrl};
    openModal(`
      <div class="modal-header"><h3>${es?'Ajustar foto':'Adjust photo'}</h3><button class="modal-close" onclick="App.cancelCrop()"><i data-lucide="x"></i></button></div>
      <div class="modal-body">
        <div class="crop-viewport" id="crop-viewport">
          <img id="crop-img" src="${dataUrl}" alt="">
          <div class="crop-circle-guide"></div>
        </div>
        <div class="crop-zoom-row">
          <i data-lucide="zoom-out" style="width:15px;height:15px;color:var(--ink-tertiary);"></i>
          <input type="range" id="crop-zoom" min="100" max="300" value="100" oninput="App.setCropZoom(this.value)">
          <i data-lucide="zoom-in" style="width:15px;height:15px;color:var(--ink-tertiary);"></i>
        </div>
        <div class="field-hint" style="text-align:center;margin-top:8px;">${es?'Arrastra para reposicionar · usa el control para acercar':'Drag to reposition · use the slider to zoom'}</div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="App.cancelCrop()">${es?'Cancelar':'Cancel'}</button><button class="btn btn-primary" onclick="App.saveCrop()"><i data-lucide="check"></i>${es?'Guardar foto':'Save photo'}</button></div>
    `);
    const img = document.getElementById('crop-img');
    const finishSetup = ()=>{
      const VP = 240;
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const ratio = Math.max(VP/nw, VP/nh);
      STATE.ui.cropState.coverW = nw*ratio;
      STATE.ui.cropState.coverH = nh*ratio;
      App.applyCropTransform();
      App.attachCropDrag();
    };
    if(img.complete && img.naturalWidth) finishSetup(); else img.onload = finishSetup;
  },
  applyCropTransform(){
    const VP = 240;
    const c = STATE.ui.cropState;
    const img = document.getElementById('crop-img');
    if(!img) return;
    const w = c.coverW*c.scale, h = c.coverH*c.scale;
    img.style.width = w+'px';
    img.style.height = h+'px';
    img.style.left = (((VP-w)/2) + c.x)+'px';
    img.style.top = (((VP-h)/2) + c.y)+'px';
  },
  setCropZoom(val){
    const c = STATE.ui.cropState;
    const newScale = val/100;
    // re-clamp existing pan to the new zoom level so the image never reveals empty space
    const VP = 240;
    const w = c.coverW*newScale, h = c.coverH*newScale;
    const maxX = Math.max(0,(w-VP)/2), maxY = Math.max(0,(h-VP)/2);
    c.scale = newScale;
    c.x = Math.max(-maxX, Math.min(maxX, c.x));
    c.y = Math.max(-maxY, Math.min(maxY, c.y));
    App.applyCropTransform();
  },
  attachCropDrag(){
    const vp = document.getElementById('crop-viewport');
    if(!vp) return;
    let dragging = false, startX=0, startY=0, origX=0, origY=0;
    const VP = 240;
    const onDown = (e)=>{
      dragging = true;
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX; startY = pt.clientY;
      const c = STATE.ui.cropState; origX = c.x; origY = c.y;
      e.preventDefault();
    };
    const onMove = (e)=>{
      if(!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const c = STATE.ui.cropState;
      const w = c.coverW*c.scale, h = c.coverH*c.scale;
      const maxX = Math.max(0,(w-VP)/2), maxY = Math.max(0,(h-VP)/2);
      c.x = Math.max(-maxX, Math.min(maxX, origX + (pt.clientX-startX)));
      c.y = Math.max(-maxY, Math.min(maxY, origY + (pt.clientY-startY)));
      App.applyCropTransform();
    };
    const onUp = ()=>{ dragging = false; };
    vp.onmousedown = onDown; vp.ontouchstart = onDown;
    document.onmousemove = (e)=>{ onMove(e); };
    document.ontouchmove = (e)=>{ if(dragging){ onMove(e); } };
    document.onmouseup = onUp; document.ontouchend = onUp;
  },
  cancelCrop(){
    STATE.ui.cropState = null;
    document.onmousemove = null; document.onmouseup = null; document.ontouchmove = null; document.ontouchend = null;
    App.openAccountModal();
  },
  saveCrop(){
    const c = STATE.ui.cropState;
    const img = document.getElementById('crop-img');
    const OUT = 320, VP = 240;
    const k = OUT/VP;
    const canvas = document.createElement('canvas');
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext('2d');
    const w = c.coverW*c.scale*k, h = c.coverH*c.scale*k;
    const left = (((VP-c.coverW*c.scale)/2) + c.x)*k;
    const top = (((VP-c.coverH*c.scale)/2) + c.y)*k;
    ctx.drawImage(img, left, top, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    document.onmousemove = null; document.onmouseup = null; document.ontouchmove = null; document.ontouchend = null;
    STATE.ui.cropState = null;
    if(!STATE.ui.accountDraft) STATE.ui.accountDraft = {name:'', company:'', photo:null};
    STATE.ui.accountDraft.photo = dataUrl;
    App.openAccountModal();
  },

    const shipping = parseFloat(f.get('shipping'))||0;
    const quotedTotal = unit*p.quantity+tooling+setup+shipping;
    const leadTimeDays = parseInt(f.get('leadTimeDays'))||30;
    const paymentTerms = f.get('paymentTerms'), validity = f.get('validity'), notes = f.get('notes');
    const supplier = currentSupplier();
    let q = p.supplierQuotes.find(x=>x.supplierId===STATE.supplierId);
    const data = {supplierId:STATE.supplierId, status:'submitted', unitPrice:unit, tooling, setup, shipping, quotedTotal,
      leadTimeDays, paymentTerms, validity, notes, documents:['cost-breakdown.pdf'], submittedAt:new Date('2026-09-08'), rating:supplier.rating, onTime:supplier.onTime};
    if(q) Object.assign(q,data); else p.supplierQuotes.push(data);
    if(p.status==='sourcing') p.status='sourcing';
    // Kept local-only, deliberately not persisted to the shared activity log —
    // it names the supplier, and that column is exactly what the client reads
    // directly (see the big confidentiality note above SUPABASE_URL).
    logActivity(p, supplier.name, 'Supplier submitted a quote.');
    if(!p.isDemo){
      const { error } = await sb.from('supplier_quotes').update({
        status:'submitted', unit_price:unit, tooling, setup, shipping, quoted_total:quotedTotal,
        lead_time_days:leadTimeDays, payment_terms:paymentTerms, validity, notes, submitted_at:new Date().toISOString(),
      }).eq('project_id', pid).eq('supplier_id', STATE.supplierId);
      if(error){ showToast(error.message); return false; }
    }
    showToast('Cotización enviada con éxito', 'success');
    navigate('#/supplier/rfq/'+pid);
    return false;
  },

  /* ---- Status transitions ---- */
  async advanceStatus(pid, status){
    const p = findProject(pid); p.status = status;
    logActivity(p,'INNOUS', status==='under_review' ? 'RFQ reviewed and approved for sourcing.' : 'RFQ approved for supplier matching.');
    if(!p.isDemo){
      const { error } = await sb.from('projects').update({ status: p.status, activity: p.activity }).eq('id', p.id);
      if(error){ showToast(error.message); return; }
    }
    showToast('RFQ status updated');
    route();
  },
  async advanceOrderStatus(pid){
    const p = findProject(pid);
    const idx = ORDER_STATUS_FLOW.indexOf(p.order.status);
    const next = ORDER_STATUS_FLOW[idx+1];
    if(!next) return;
    p.order.status = next;
    if(p.order.milestones[idx+1]){ p.order.milestones[idx+1].done = true; p.order.milestones[idx+1].date = new Date('2026-09-08'); }
    // Payment status is deliberately NOT touched here — production progress is the
    // supplier's call, billing/collection is INNOUS's (see App.setPaymentStatus).
    const justCompleted = next==='delivered';
    const justStarted = p.status==='awarded';
    if(justCompleted){ p.status='completed'; recalcSupplierMetrics(p.selectedSupplierId); }
    else if(justStarted) p.status='in_production';
    logActivity(p, supplierName(p.selectedSupplierId), `Production status updated to "${ORDER_STATUS_META[next].label}".`);
    if(!p.isDemo){
      const { error: e1 } = await sb.from('orders').update({status: next}).eq('project_id', pid);
      if(e1){ showToast(e1.message); return; }
      if(justCompleted || justStarted){
        // Whichever role is advancing the order writes this — INNOUS always
        // can (its usual "for all"); the supplier can too, but only for its
        // own awarded project (see supabase-fix10-order-status.sql).
        const { error: e2 } = await sb.from('projects').update({status: p.status}).eq('id', pid);
        if(e2){ showToast(e2.message); return; }
      }
      if(justCompleted) await persistSupplierMetrics(p.selectedSupplierId);
    }
    showToast(`Pedido ${p.id} actualizado a ${orderStatusLabel(next, true)}`, 'success');
    route();
  },
  async setPaymentStatus(pid, status){
    const p = findProject(pid);
    p.order.paymentStatus = status;
    logActivity(p, 'INNOUS', `Payment status updated to "${status}".`);
    if(!p.isDemo){
      const { error } = await sb.from('orders').update({payment_status: status}).eq('project_id', pid);
      if(error){ showToast(error.message); return; }
    }
    showToast(`Payment status set to ${status}`, 'success');
    route();
  },
  async setQualityStatus(pid, status){
    const p = findProject(pid);
    p.order.quality.status = status;
    if(status==='ncr_open'){
      p.order.quality.ncr = [{id:'NCR-'+Math.floor(Math.random()*900+100), issue:'Quality issue flagged by INNOUS', status:'Under Review'}];
    } else if(status==='approved'){
      p.order.quality.ncr = [];
    }
    logActivity(p, 'INNOUS', `Quality inspection ${status==='approved'?'approved':'rejected — NCR opened'}.`);
    recalcSupplierMetrics(p.selectedSupplierId);
    if(!p.isDemo){
      const { error } = await sb.from('orders').update({quality_status: p.order.quality.status, quality_ncr: p.order.quality.ncr}).eq('project_id', pid);
      if(error){ showToast(error.message); return; }
      await persistSupplierMetrics(p.selectedSupplierId);
    }
    showToast(status==='approved' ? 'Quality approved' : 'Quality rejected — NCR opened', status==='approved'?'success':undefined);
    route();
  },

  /* ---- Messaging ---- */
  openClientChat(pid){ STATE.ui.activeChatKey = pid; route(); },
  sendClientMessage(pid){
    const input = document.getElementById('client-chat-input'); const text = input.value.trim(); if(!text) return;
    const thread = pid==='general' ? chatOf(currentClient()) : findProject(pid).chatClient;
    thread.push({from:'client', text, ts:new Date('2026-09-08')});
    route();
    setTimeout(()=>{ thread.push({from:'innous', text:'Thanks for the note — our team is on it and will follow up shortly.', ts:new Date('2026-09-08')}); if(location.hash.includes('client/messages')) route(); }, 900);
  },
  /* General (not-tied-to-an-RFQ) conversation, started by INNOUS from a customer's
     or supplier's detail page — key is 'gc:<customerId>' or 'gs:<supplierId>'. */
  startGeneralChat(type, id){
    STATE.ui.activeChatKey = (type==='client'?'gc:':'gs:')+id;
    closeModal();
    navigate('#/innous/messages');
  },
  openInnousChat(key){ STATE.ui.activeChatKey = key; route(); },
  sendInnousMessage(key){
    const input = document.getElementById('innous-chat-input'); const text = input.value.trim(); if(!text) return;
    // Guards against a stale key from another tab where that customer/supplier
    // has since been deleted — rather than crashing, just drop the send.
    if(key.startsWith('gc:')){ const c = CUSTOMERS.find(x=>x.id===key.slice(3)); if(!c){ showToast('This customer no longer exists.'); route(); return; } chatOf(c).push({from:'innous', text, ts:new Date('2026-09-08')}); }
    else if(key.startsWith('gs:')){ const s = SUPPLIERS.find(x=>x.id===key.slice(3)); if(!s){ showToast('This supplier no longer exists.'); route(); return; } chatOf(s).push({from:'innous', text, ts:new Date('2026-09-08')}); }
    else {
      const [type,pid,sid] = key.split(':'); const p = findProject(pid);
      if(type==='c') p.chatClient.push({from:'innous', text, ts:new Date('2026-09-08')});
      else p.chatSupplier[sid].push({from:'innous', text, ts:new Date('2026-09-08')});
    }
    route();
  },
  openSupplierChat(pid){ STATE.ui.activeChatKey = pid; route(); },
  sendSupplierMessage(pid){
    const input = document.getElementById('supplier-chat-input'); const text = input.value.trim(); if(!text) return;
    const thread = pid==='general' ? chatOf(currentSupplier()) : findProject(pid).chatSupplier[STATE.supplierId];
    thread.push({from:'supplier', text, ts:new Date('2026-09-08')});
    route();
    setTimeout(()=>{ thread.push({from:'innous', text:'Entendido, gracias por la actualización.', ts:new Date('2026-09-08')}); if(location.hash.includes('supplier/messages')) route(); }, 900);
  },
};

document.addEventListener('click', ()=>{
  const m=document.getElementById('role-menu'); if(m) m.classList.remove('open');
  const n=document.getElementById('notif-menu'); if(n) n.classList.remove('open');
});

/* ---------- Init ---------- */
// This is a real portal, not a demo: it starts genuinely empty (no pre-seeded
// customers/suppliers/RFQs). INNOUS can optionally load a set of example data
// to explore the platform's full richness — see App.loadExampleData on the
// Settings page — which persists via this flag until explicitly cleared.
if(localStorage.getItem('innous_demo_loaded')==='1'){
  buildProjects();
} else {
  CUSTOMERS.length = 0;
  SUPPLIERS.length = 0;
  PROJECTS = [];
}
// Real accounts, their customer/supplier records, and their RFQs/orders always
// persist on top of whichever base above — this is what makes them survive a
// refresh instead of only the currently-logged-in account's own record.
loadRealData();
window.addEventListener('hashchange', ()=>{ if(STATE.authMode!=='guest') route(); });
let booted = false;
/* A slow or dropped connection to Supabase used to leave the page stuck
   totally blank forever (both #auth-root and #app-shell start hidden, and
   nothing ever un-hides them if the request never resolves). Race every
   startup network call against a timeout, and show something — a spinner,
   then a "this is slow" note, then a real error with a retry button —
   instead of silence. */
function hideBootLoading(){ document.getElementById('boot-loading')?.remove(); }
function showBootError(msg){
  const el = document.getElementById('boot-loading'); if(!el) return;
  el.innerHTML = `
    <div style="font-family:'Ubuntu',sans-serif;font-weight:700;color:#18181B;font-size:14px;text-align:center;max-width:320px;padding:0 20px;line-height:1.5;">${msg}</div>
    <button onclick="location.reload()" style="padding:10px 22px;border-radius:9px;border:1px solid #D4D4D8;background:#fff;font-weight:600;font-size:13px;cursor:pointer;">Reintentar</button>
  `;
}
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout:'+label)), ms)),
  ]);
}
async function boot(){
  if(booted) return; booted = true;
  const slowTimer = setTimeout(()=>{ const t=document.getElementById('boot-loading-text'); if(t) t.textContent='Esto está tardando más de lo normal…'; }, 4000);
  try{
    const { data: { session } } = await withTimeout(sb.auth.getSession(), 10000, 'session');
    if(session && session.user){
      await withTimeout(enterAppAsUser(session.user), 15000, 'enterApp');
    } else {
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('auth-root').style.display = '';
      renderAuthRoot();
    }
    clearTimeout(slowTimer);
    hideBootLoading();
  }catch(err){
    clearTimeout(slowTimer);
    console.error('boot failed', err);
    showBootError('No se pudo conectar con el servidor. Revisa tu conexión a internet e intenta de nuevo.');
  }
  lucide.createIcons();
}
window.addEventListener('DOMContentLoaded', boot);
if(document.readyState!=='loading'){ boot(); }
