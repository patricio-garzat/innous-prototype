function markupKey(pid,sid){ return pid+'::'+sid; }
function getMarkup(pid,sid){ const k=markupKey(pid,sid); if(STATE.ui.markupDrafts[k]===undefined) STATE.ui.markupDrafts[k]=STATE.settings.defaultMarkupPct; return STATE.ui.markupDrafts[k]; }
// One shared rate per RFQ, not per supplier — it's a market exchange rate,
// not something that varies by who you're comparing (see
// App.setExchangeRate / Settings' Default Exchange Rate for the starting
// value). Always overridable right here since the real rate moves daily.
function getExchangeRate(pid){ if(STATE.ui.exchangeRateDrafts[pid]===undefined) STATE.ui.exchangeRateDrafts[pid]=STATE.settings.defaultExchangeRate; return STATE.ui.exchangeRateDrafts[pid]; }

// One card per submitted supplier quote — replaces the old dense
// comparison table (fix40) with a clear split between what the supplier
// actually quoted (their own MXN numbers, read-only) and what INNOUS's
// pricing does to it: margin and both the plain and IVA-inclusive customer
// price update live as markup/exchange rate change, so INNOUS always knows
// exactly what it's making before adding a supplier to the shortlist.
// Shipping cost (fix41) — added to the customer's price BEFORE the
// shortlist ever gets sent, same lifecycle as markup/exchange rate: a
// shared, ephemeral working value (getFreight/App.setFreight) that gets
// snapshotted into each shortlist entry the moment it's added
// (App.addToShortlist), and never retroactively touches entries already
// added. This replaced a "Freight" field that used to live in Formal Quote
// Details and only got applied once the final PDF was generated — AFTER
// the customer had already picked an option based on a price that didn't
// include it.
function getFreight(pid){ return STATE.ui.freightDrafts[pid] ?? 0; }
// What the supplier actually quoted, rendered as pricing-panel rows (fix42)
// — one combined row (unit price × total quantity) for a single-item RFQ,
// or one row per item using that item's own submitted unit price
// (q.itemPrices) for a multi-item RFQ. A single blended "unit price ×
// total quantity" line stopped meaning anything once an RFQ could mix
// different parts at different prices, so this is the one place that
// distinction is decided — every INNOUS/supplier view of a supplier's raw
// quote renders through this instead of duplicating the same branch three
// times with slightly different labels.
function supplierQuotePriceRows(p, q, opts={}){
  const label = opts.label || 'Unit Price';
  const unitsWord = opts.unitsWord || '';
  const valueAttr = opts.strongValue ? ' class="td-strong"' : '';
  if(q.itemPrices && q.itemPrices.length && p.items && p.items.length){
    return p.items.map((it,i)=>{
      const ip = q.itemPrices[i] || {unitPrice:0, total:0};
      const desc = (it.description||'').length>40 ? it.description.slice(0,40)+'…' : (it.description||'');
      return `<div class="pricing-row"><span>${label} ${i+1} — ${escAttr(desc)} (${fmtMXN2(ip.unitPrice)} × ${(it.quantity||0).toLocaleString()}${unitsWord})</span><span${valueAttr}>${fmtMXN(ip.total)}</span></div>`;
    }).join('');
  }
  return `<div class="pricing-row"><span>${label} (${fmtMXN2(q.unitPrice)} × ${p.quantity.toLocaleString()}${unitsWord})</span><span${valueAttr}>${fmtMXN(q.unitPrice*p.quantity)}</span></div>`;
}
function quoteCompareCard(p, q, rate, freight, isShortlisted){
  const supplier = SUPPLIERS.find(s=>s.id===q.supplierId);
  const markup = getMarkup(p.id, q.supplierId);
  const costUsd = q.quotedTotal/rate;
  const customerPrice = costUsd*(1+markup/100) + freight;
  const marginUsd = customerPrice - costUsd - freight;
  const marginPct = customerPrice>0 ? (marginUsd/customerPrice*100) : 0;
  return `
  <div class="card card-pad" style="box-shadow:none;border:1px solid var(--border,#EAEAEA);">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div>
        <div style="font-weight:700;font-size:14.5px;">${supplier?supplier.name:'Proveedor Eliminado'}</div>
        <div class="td-sub">${supplier?`${supplier.city} · ${supplier.rating}★`:'—'} · ${q.leadTimeDays} días de entrega</div>
      </div>
      ${isShortlisted?'<span class="badge badge-green">En Shortlist</span>':`<button class="btn btn-primary btn-sm" ${p.shortlist.length>=5?'disabled':''} onclick="App.addToShortlist('${p.id}','${q.supplierId}')"><i data-lucide="plus"></i>Agregar al Shortlist</button>`}
    </div>
    <hr class="divider">
    <div class="info-item-label" style="margin-bottom:6px;">Cotización del Proveedor</div>
    <div class="pricing-panel">
      ${supplierQuotePriceRows(p, q, {label:'Precio Unitario'})}
      <div class="pricing-row"><span>Envío (del proveedor)</span><span>${q.shipping?fmtMXN(q.shipping):'Incluido'}</span></div>
      <div class="pricing-row"><span>Costo Total (sin IVA)</span><span>${fmtMXN(q.quotedTotal)} <span style="font-weight:400;opacity:0.85;">(${fmtMoney(costUsd)})</span></span></div>
      <div class="pricing-row"><span>IVA (16%)</span><span>${fmtMXN(q.quotedTotal*IVA_RATE)}</span></div>
      <div class="pricing-row total"><span>Costo Total con IVA</span><span>${fmtMXN(withIva(q.quotedTotal))} <span style="font-weight:400;opacity:0.85;">(${fmtMoney(withIva(costUsd))})</span></span></div>
    </div>
    <div class="info-item-label" style="margin:14px 0 8px;">Tu Precio al Cliente</div>
    <div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;">
      <div class="form-group" style="margin:0;"><label class="field-label">Markup %</label><input type="number" value="${markup}" min="0" max="100" style="width:72px;" onchange="App.setMarkup('${p.id}','${q.supplierId}', this.value)"></div>
      <div><div class="field-label">Margen de INNOUS</div><div style="font-size:16px;font-weight:700;color:var(--success);">${fmtMoney(marginUsd)}</div><div class="field-hint" style="margin-top:1px;">${marginPct.toFixed(1)}% del precio al cliente</div></div>
    </div>
    <div class="pricing-panel" style="margin-top:12px;">
      ${freight?`<div class="pricing-row"><span>Precio del Producto</span><span>${fmtMoney(customerPrice-freight)}</span></div><div class="pricing-row"><span>Envío (al cliente)</span><span>${fmtMoney(freight)}</span></div>`:''}
      <div class="pricing-row total"><span>Precio al Cliente</span><span>${fmtMoney(customerPrice)}</span></div>
    </div>
  </div>`;
}
function quoteComparisonSection(p){
  const submitted = p.supplierQuotes.filter(q=>q.status==='submitted');
  if(!submitted.length) return '';
  const shortlisted = new Set(p.shortlist.map(s=>s.supplierId));
  const rate = getExchangeRate(p.id);
  const freight = getFreight(p.id);
  return `
  <div class="card card-pad" style="margin-bottom:20px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
      <div><div class="section-title">Comparar Cotizaciones de Proveedores</div><div class="section-sub">El precio del proveedor es confidencial — solo visible dentro del portal de INNOUS. Los proveedores cotizan en MXN — pon el tipo de cambio de hoy para convertir a USD.</div></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <div class="form-group" style="margin:0;"><label class="field-label">Tipo de Cambio (MXN por USD)</label><input type="number" step="0.01" min="0.01" value="${rate}" style="width:100px;" onchange="App.setExchangeRate('${p.id}', this.value)"></div>
        <div class="form-group" style="margin:0;"><label class="field-label">Envío al Cliente (USD)</label><input type="number" step="0.01" min="0" value="${freight}" style="width:100px;" onchange="App.setFreight('${p.id}', this.value)"></div>

      </div>
      <button class="btn btn-primary" ${(p.shortlist.length && quoteDetailsComplete(p))?'':'disabled'} onclick="App.sendQuotesToCustomer('${p.id}')"><i data-lucide="send"></i>Enviar Cotizaciones al Cliente</button>
    </div>
  </div>`;
}

      ${p.shortlist.map(s=>`<tr><td class="td-strong">${supplierName(s.supplierId)}</td><td>${s.supplierCostMxn?fmtMXN(s.supplierCostMxn):'—'}</td><td class="td-sub">${s.exchangeRate||'—'}</td><td>${fmtMoney(s.supplierCost)}</td><td>${s.markupPct}%</td><td>${fmtMoney(s.customerPrice-s.supplierCost-(s.freightUsd||0))}</td><td class="td-strong">${fmtMoney(s.customerPrice)}</td><td>${s.leadTimeDays} días</td><td>${s.badge?`<span class="award-badge ${BADGE_CLASS[s.badge]}">${s.badge}</span>`:''}</td></tr>`).join('')}

/* ---- Formal Quote Details — the fields that end up on the client's
   downloadable PDF (generateQuotePdf). Deliberately never auto-filled from
   the supplier's own quote (payment terms, delivery date) — INNOUS always
   fills these in by hand, since it's INNOUS's commercial commitment to the
   customer, not the supplier's.
   Shown (and required) TWICE, on purpose:
   - Before "Send Quotes to Customer" even exists as an option — the
     customer must never receive a shortlist INNOUS hasn't first decided
     the commercial terms for. No specific supplier is awarded yet at this
     point, so Delivery Time defaults to the longest lead time among the
     shortlisted options (a safe commitment regardless of who the customer
     ends up picking) rather than a single supplier's number.
   - Again after the customer selects (still editable) — Delivery Time can
     be tightened to the actually-awarded supplier's real lead time then,
     and salesperson/payment terms can still be corrected if needed. */
function quoteDetailsSection(p, opts){
  const required = !!(opts && opts.required);
  if(!STATE.ui.quoteDetailsDrafts[p.id]){
    const awarded = p.shortlist.find(s=>s.supplierId===p.selectedSupplierId);
    const fallbackDays = awarded ? awarded.leadTimeDays : (p.shortlist.length ? Math.max(...p.shortlist.map(s=>s.leadTimeDays)) : '');
    STATE.ui.quoteDetailsDrafts[p.id] = {
      salespersonName: p.quoteSalespersonName || INNOUS_QUOTE_SIGNATURE.name,
      salespersonEmail: p.quoteSalespersonEmail || INNOUS_QUOTE_SIGNATURE.email,
      paymentTerms: p.quotePaymentTerms || QUOTE_TERMS_DEFAULTS.paymentTerms,
      deliveryDays: p.quoteDeliveryDays || fallbackDays || '',
      countryOrigin: p.quoteCountryOrigin || QUOTE_TERMS_DEFAULTS.countryOrigin,
      warranty: p.quoteWarranty || QUOTE_TERMS_DEFAULTS.warranty,
      validityDays: p.quoteValidityDays || QUOTE_TERMS_DEFAULTS.validityDays,
      toolingNote: p.quoteToolingNote || QUOTE_TERMS_DEFAULTS.toolingNote,
      discount: p.quoteDiscount || 0,
    };
  }
  const d = STATE.ui.quoteDetailsDrafts[p.id];
  const isConfirmed = quoteDetailsComplete(p);
  const upd = (field)=>`App.updateQuoteDetailDraft('${p.id}','${field}',this.value)`;
  return `
  <div class="card card-pad" style="margin-top:20px;">
    <div class="section-title">Detalles de la Cotización Formal</div>
    <div class="section-sub">${required
      ? 'Lo que dirá la cotización formal del cliente en cuanto elija un proveedor — llénalo y guárdalo antes de poder enviar este shortlist. El cliente nunca ve nada de esto hasta que elige.'
      : 'Esto es lo que realmente se imprime en la cotización formal descargable del cliente — nunca sale de los números del proveedor. Llénalo y guárdalo antes de que el cliente descargue su cotización.'}</div>
    ${!isConfirmed ? stageBanner(required ? 'Requerido — guarda esto antes de que se habilite "Enviar Cotizaciones al Cliente" abajo.' : 'Aún sin confirmar — el PDF del cliente usará valores genéricos hasta que guardes esto.', 'action') : ''}
    <div class="form-row" style="margin-top:14px;">
      <div class="form-group"><label class="field-label">Nombre del Vendedor</label><input type="text" value="${escAttr(d.salespersonName)}" oninput="${upd('salespersonName')}"></div>
      <div class="form-group"><label class="field-label">Correo del Vendedor</label><input type="email" value="${escAttr(d.salespersonEmail)}" oninput="${upd('salespersonEmail')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="field-label">Condiciones de Pago</label><input type="text" value="${escAttr(d.paymentTerms)}" oninput="${upd('paymentTerms')}"></div>

// already saved on this order, or already on file for the supplier from a
// past order (rfc/address). Gates App.authorizeProject exactly the way
// quoteDetailsComplete gates sendQuotesToCustomer.
function purchaseOrderDetailsComplete(p){
  const supplier = SUPPLIERS.find(s=>s.id===p.selectedSupplierId) || {};
  return !!(supplier.rfc && supplier.address && p.order && p.order.poBuyerName && p.order.poDeliveryLocation

   Compra needs that isn't already known from earlier in the flow. Shown
   only once the customer has awarded a supplier and before INNOUS
   authorizes the project (that's the exact moment "we're about to send
   this project to the supplier" — see App.authorizeProject). Two kinds of
   field here, saved to two different places:

     between orders — saved onto the supplier's own record, so the very
     next order for this same supplier already has it pre-filled and this
     card won't even ask for it again.

     order itself. */

      <div class="form-group"><label class="field-label">Incoterm / Flete</label><input type="text" value="${escAttr(d.incoterm)}" oninput="${upd('incoterm')}"></div>
    </div>
    <div class="form-row">

/* ---- Constancia de Situación Fiscal (CSF) parser (fix46) — a supplier's
   uploaded SAT constancia has a real text layer (it's a generated PDF, not
   a scan), so pdf.js's getTextContent() gets us plain text straight off it,
   no OCR needed. SAT's CSF is a fixed government template — the same
   labels, in the same order, on every one — so rather than trust a strict
   column layout (pdf.js can reorder side-by-side table cells within a
   row), this treats every known label as an anchor and takes whatever text
   falls between one label and whichever OTHER known label comes next. That
   survives most local reordering as long as the labels themselves stay
   intact, which they always do — each is one contiguous string in SAT's
   generator. This only ever fills the DRAFT fields (see
   App.onSupplierCsfSelected) — INNOUS still has to review and click
   Guardar, so a bad read on some CSF layout variant never silently commits. */
const CSF_FIELD_LABELS = [
  'RFC:', 'Denominación/Razón Social:', 'Régimen Capital:', 'Nombre Comercial:',
  'Fecha inicio de operaciones:', 'Estatus en el padrón:', 'Fecha de último cambio de estado:',
  'Código Postal:', 'Tipo de Vialidad:', 'Nombre de Vialidad:', 'Número Exterior:',
  'Número Interior:', 'Nombre de la Colonia:', 'Nombre de la Localidad:',
  'Nombre del Municipio o Demarcación Territorial:', 'Nombre de la Entidad Federativa:',
  'Entre Calle:', 'Y Calle:', 'Actividades Económicas:',
];
function parseCsfText(text){
  const norm = text.replace(/\s+/g,' ').trim();
  const out = {};
  for(let i=0;i<CSF_FIELD_LABELS.length;i++){
    const label = CSF_FIELD_LABELS[i];
    const start = norm.indexOf(label);
    if(start===-1) continue;
    const from = start+label.length;
    let end = norm.length;
    for(let j=0;j<CSF_FIELD_LABELS.length;j++){
      if(j===i) continue;
      const idx = norm.indexOf(CSF_FIELD_LABELS[j], from);
      if(idx!==-1 && idx<end) end = idx;
    }
    out[label] = norm.slice(from, end).trim();
  }
  return out;
}
// Assembles the CSF's ~9 separate domicilio fields into the one address
// line the PO's "Domicilio" row actually shows — same shape as INNOUS's
// own address in DEFAULT_SETTINGS ("Palma Real No. 115, Fracc. ... C.P.").
function csfAddressLine(f){
  const vialidad = f['Nombre de Vialidad:']||'', extNo = f['Número Exterior:']||'', intNo = f['Número Interior:']||'';
  const colonia = f['Nombre de la Colonia:']||'', municipio = f['Nombre del Municipio o Demarcación Territorial:']||'';
  const estado = f['Nombre de la Entidad Federativa:']||'', cp = f['Código Postal:']||'';
  let calle = vialidad;
  if(extNo) calle += ' No. '+extNo;
  if(intNo) calle += ' Int. '+intNo;
  const bits = [calle.trim(), colonia?('Col. '+colonia):'', municipio, estado].filter(Boolean);
  let addr = bits.join(', ');
  if(cp) addr += ' '+cp;
  return addr.replace(/\s+/g,' ').trim();
}
/* ---- Contact Info — the contact this supplier registered on the

/* ---- Billing Info — exactly what a Constancia de Situación Fiscal (CSF)
   carries: Razón Social, RFC and the registered Domicilio, for this

/* ---- Settings shortcut to the sections above (fix43, extended by fix46
   for contact info, redesigned by fix47) — the same customerContactSection()/
   customerBillingSection()/supplierContactSection()/supplierBillingSection()

// The modal opened by a row click above — one account's contact + billing
// forms together, so both are one click away instead of split across two
// separate cards on a page.
function accountInfoModalHtml(){
  const { type, id } = STATE.ui.accountInfoModal || {};
  if(type==='customer'){
    const c = CUSTOMERS.find(x=>x.id===id); if(!c) return '';
    return `
    <div class="modal-header"><h3>${c.company}</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="modal-body">${customerContactSection(c)}${customerBillingSection(c)}</div>`;
  }
  if(type==='supplier'){
    const s = SUPPLIERS.find(x=>x.id===id); if(!s) return '';
    return `
    <div class="modal-header"><h3>${s.name}</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="modal-body">${supplierContactSection(s)}${supplierBillingSection(s)}</div>`;
  }
  return '';
}
// Called after every save/CSF action so a modal left open reflects what was
// just saved (route() alone only re-renders the page behind it, not this
// separate modal-root subtree).
function refreshAccountInfoModalIfOpen(type, id){
  const m = STATE.ui.accountInfoModal;
  if(m && m.type===type && m.id===id && document.getElementById('modal-overlay')) openModal(accountInfoModalHtml(), true);
}

/* ---- INNOUS: a single supplier quote, standalone — deliberately NOT the
   whole RFQ page (files, comparison tools, quote-detail editing, etc.).
   Clicking a row in "Quotes" used to dump you on the exact same page as
   clicking the RFQ from the RFQs list, which made the Quotes list itself
   pointless. This shows just what matters about ONE quote: if it made the
   shortlist, exactly what the customer was shown for it (their price and
   lead time, no supplier identity/cost — same boundary the customer's own
   view has); if it didn't, that it was never sent. INNOUS's own cost/margin
   context sits below either way, since this view is INNOUS-only. */
ROUTES['innous/quote'] = function(pid, sid){
  const p = findProject(pid); if(!p) return emptyState('search','Cotización no encontrada','');
  const q = p.supplierQuotes.find(x=>x.supplierId===sid);
  if(!q) return emptyState('search','Cotización no encontrada','');
  const shortlisted = p.shortlist.find(s=>s.supplierId===sid);
  // A target-price RFQ never goes through the shortlist/comparison step at
  // all — the first supplier to accept is awarded directly (see
  // App.acceptTargetPrice / supplier_accept_target_price). Only the winner
  // ever reaches this page with status 'submitted' (everyone else invited
  // gets marked 'declined'), so that alone identifies this case — no need
  // to also check p.selectedSupplierId.
  const isTargetPriceAward = !!p.targetPriceSupplierBudgetMxn && q.status==='submitted';
  return `
  <div class="content-inner" style="max-width:700px;">
    <div class="breadcrumb"><a href="#/innous/quotes">Cotizaciones</a><i data-lucide="chevron-right" style="width:12px;height:12px;"></i><span>${p.id}</span></div>
    <div class="page-header"><div><div class="page-title">${p.projectName}</div><div class="page-subtitle mono">${p.id} · ${supplierName(sid)} → ${customerName(p.customerId)}</div></div>
      ${isTargetPriceAward?'<span class="badge badge-blue">Adjudicado — Target Price</span>':shortlisted?'<span class="badge badge-green">Enviada al Cliente</span>':'<span class="badge badge-gray">No en Shortlist</span>'}
    </div>
    ${isTargetPriceAward ? `
    <div class="card card-pad">
      <div class="section-title">Adjudicado por Target Price</div>
      <div class="section-sub">El cliente fijó un target price para este RFQ — ${supplierName(sid)} fue el primer proveedor en aceptarlo, así que el proyecto se adjudicó directo. No hubo shortlist ni comparación del cliente; ese es todo el sentido de un target price.</div>
      <div class="pricing-panel" style="margin-top:14px;">
        <div class="pricing-row"><span>Target Price del Cliente (USD)</span><span class="td-strong">${fmtMoney(p.targetPriceUsd)}</span></div>
        <div class="pricing-row"><span>Presupuesto del Proveedor (MXN)</span><span>${fmtMXN(p.targetPriceSupplierBudgetMxn)}</span></div>
        <div class="pricing-row"><span>Tiempo de Entrega</span><span>${q.leadTimeDays} días</span></div>
      </div>
    </div>
    <div class="card card-pad" style="margin-top:16px;">
      <div class="section-title">Detalles Internos</div>
      <div class="section-sub">Visible solo dentro de INNOUS.</div>
      <div class="info-grid" style="grid-template-columns:1fr 1fr;margin-top:12px;">
        ${infoItem('Markup', (p.targetPriceMarkupPct??'—')+'%')}
        ${infoItem('Tipo de Cambio', p.targetPriceExchangeRate??'—')}
        ${infoItem('Costo del Proveedor (MXN)', fmtMXN(p.targetPriceSupplierBudgetMxn))}
        ${infoItem('Margen de INNOUS (USD)', p.order?fmtMoney(p.order.customerPrice-p.order.supplierCost):'—')}
      </div>
    </div>` : shortlisted ? `
    <div class="card card-pad">
      <div class="section-title">Lo que Vio el Cliente</div>
      <div class="section-sub">Exactamente el precio y tiempo de entrega que vio ${customerName(p.customerId)} para esta opción — la identidad del proveedor, el costo y el margen de INNOUS nunca fueron parte de esto.</div>
      <div class="pricing-panel" style="margin-top:14px;">
        <div class="pricing-row"><span>Precio al Cliente (USD)</span><span class="td-strong">${fmtMoney(shortlisted.customerPrice)}</span></div>
        <div class="pricing-row"><span>Tiempo de Entrega</span><span>${shortlisted.leadTimeDays} días</span></div>
        <div class="pricing-row"><span>Calidad</span><span>${shortlisted.rating||0} / 5.0</span></div>
        ${shortlisted.badge?`<div class="pricing-row"><span>Badge</span><span class="award-badge ${BADGE_CLASS[shortlisted.badge]}">${shortlisted.badge}</span></div>`:''}
      </div>
    </div>
    <div class="card card-pad" style="margin-top:16px;">
      <div class="section-title">Detalles Internos</div>
      <div class="section-sub">Visible solo dentro de INNOUS.</div>
      <div class="info-grid" style="grid-template-columns:1fr 1fr;margin-top:12px;">
        ${infoItem('Costo del Proveedor (MXN)', shortlisted.supplierCostMxn?fmtMXN(shortlisted.supplierCostMxn):'—')}

        ${infoItem('Costo del Proveedor (USD)', fmtMoney(shortlisted.supplierCost))}
        ${infoItem('Markup', shortlisted.markupPct+'%')}
        ${infoItem('Envío (USD)', fmtMoney(shortlisted.freightUsd||0))}

      </div>

    <div class="card card-pad">
      <div class="section-title">No Enviada al Cliente</div>

        ${infoItem('Enviada', fmtDate(q.submittedAt))}
      </div>
    </div>`}
  </div>`;
};

/* ---- INNOUS Analytics ---- */
ROUTES['innous/analytics'] = function(){
  const withOrder = PROJECTS.filter(p=>p.order);
  const thisMonth = PROJECTS.filter(p=> new Date(p.createdAt) > daysFromNow(-30)).length;
  const awarded = PROJECTS.filter(p=>p.order).length;
  const totalShortlisted = PROJECTS.filter(p=>p.shortlist.length>0).length;
  const winRate = totalShortlisted? Math.round(awarded/totalShortlisted*100) : 0;
  const avgMarkup = withOrder.length? (withOrder.reduce((s,p)=>s+p.order.markupPct,0)/withOrder.length).toFixed(1) : 0;
  // Analytics is Innous's own internal view of the business, so everything
  // here is in MXN — even though customerPrice is stored in USD per order.
  // Each order converts at its OWN exchange rate (the one actually used at
  // the time, from client_select_quote), never a single "today's rate"
  // applied retroactively to every historical order.
  const rateFor = p => p.order.exchangeRate || STATE.settings.defaultExchangeRate || DEFAULT_SETTINGS.defaultExchangeRate;
  const customerPriceMxn = p => p.order.customerPrice*rateFor(p);
  const supplierCostMxnOf = p => p.order.supplierCostMxn || p.order.supplierCost*rateFor(p);
  const avgValue = withOrder.length? withOrder.reduce((s,p)=>s+customerPriceMxn(p),0)/withOrder.length : 0;
  const revenue = withOrder.reduce((s,p)=>s+customerPriceMxn(p),0);
  const margin = withOrder.reduce((s,p)=>s+(customerPriceMxn(p)-supplierCostMxnOf(p)-(p.order.freightUsd||0)*rateFor(p)),0);

  const custCounts = {}; withOrder.forEach(p=>{ custCounts[p.customerId]=(custCounts[p.customerId]||0)+customerPriceMxn(p); });
  const topCustomers = Object.entries(custCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCust = topCustomers.length? topCustomers[0][1] : 1;

  const supCounts = {}; withOrder.forEach(p=>{ supCounts[p.selectedSupplierId]=(supCounts[p.selectedSupplierId]||0)+1; });
  const topSuppliers = Object.entries(supCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxSup = topSuppliers.length? topSuppliers[0][1] : 1;

  const procCounts = {}; PROJECTS.forEach(p=>{ procCounts[p.process]=(procCounts[p.process]||0)+1; });
  const topProcess = Object.entries(procCounts).sort((a,b)=>b[1]-a[1]);
  const maxProc = topProcess.length? topProcess[0][1] : 1;

  return `
  <div class="content-inner">
    <div class="page-header"><div><div class="page-title">Analítica</div><div class="page-subtitle">Desempeño de la plataforma en sourcing y cumplimiento</div></div></div>
    <div class="grid grid-4" style="margin-bottom:16px;">
      ${kpiCard('RFQs Este Mes', thisMonth, 'nuevas solicitudes enviadas','file-text')}
      ${kpiCard('Tasa de Cierre', winRate+'%', 'shortlist → pedido adjudicado','target')}
      ${kpiCard('Markup Promedio', avgMarkup+'%', 'en todos los pedidos adjudicados','percent')}
      ${kpiCard('Valor Promedio de Proyecto', fmtMXN(avgValue), 'por pedido adjudicado','dollar-sign')}
    </div>
    <div class="grid grid-2" style="margin-bottom:16px;">
      ${kpiCard('Ingresos', fmtMXN(revenue), 'entre pedidos activos y completados','trending-up')}
      ${kpiCard('Margen Bruto', fmtMXN(margin), (revenue?(margin/revenue*100).toFixed(1):0)+'% margen combinado','wallet')}
    </div>
    <div class="grid grid-2">
      <div class="card card-pad">
        <div class="section-title">Top Clientes por Ingresos</div>
        <div style="margin-top:14px;">${topCustomers.map(([cid,val])=>`<div class="bar-row"><div class="bar-label">${customerName(cid)}</div><div class="bar-track"><div class="bar-fill" style="width:${val/maxCust*100}%;"></div></div><div class="bar-val">${fmtMXN(val)}</div></div>`).join('')}</div>
      </div>
      <div class="card card-pad">
        <div class="section-title">Top Proveedores por Pedidos Ganados</div>
        <div style="margin-top:14px;">${topSuppliers.map(([sid,val])=>`<div class="bar-row"><div class="bar-label">${supplierName(sid)}</div><div class="bar-track"><div class="bar-fill" style="width:${val/maxSup*100}%;"></div></div><div class="bar-val">${val}</div></div>`).join('')}</div>
      </div>
    </div>
    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card card-pad">
        <div class="section-title">Proceso de Manufactura Más Solicitado</div>
        <div style="margin-top:14px;">${topProcess.map(([proc,val])=>`<div class="bar-row"><div class="bar-label">${proc}</div><div class="bar-track"><div class="bar-fill" style="width:${val/maxProc*100}%;"></div></div><div class="bar-val">${val}</div></div>`).join('')}</div>
      </div>
      <div class="card card-pad">
        <div class="section-title">Tiempos de Respuesta</div>
        <div style="margin-top:14px;">
          <div class="pricing-row"><span>Tiempo promedio de respuesta del proveedor</span><span class="td-strong">3.4 días</span></div>
          <div class="pricing-row"><span>Tiempo promedio de decisión del cliente</span><span class="td-strong">2.1 días</span></div>
          <div class="pricing-row"><span>Tiempo promedio a la primera cotización</span><span class="td-strong">4.8 días</span></div>
          <div class="pricing-row"><span>Tiempo promedio RFQ → adjudicación</span><span class="td-strong">11.6 días</span></div>
        </div>
      </div>
    </div>
  </div>`;
};

/* ---- INNOUS Messages ---- */
// (type, id, threadName) come from a deep link — either clicking a message
// notification (see the notif-menu rendering in renderShell) or
// App.startChat navigating here from a Customer/Supplier/RFQ/Order page —
// and select that exact chat before anything else about this render
// happens. Each customer/supplier can have several named chats going at
// once (see chatThread/entityThreads) — the list below is every one of
// them, across every person, most-recently-active first.
ROUTES['innous/messages'] = function(type, id, threadNameRaw){
  if(type && id) STATE.ui.activeChatKey = type+':'+id+':'+decodeURIComponent(threadNameRaw||'General');
  if(STATE.ui.activeChatKey){
    const [t, oid, ...rest] = STATE.ui.activeChatKey.split(':');
    const owner = t==='client' ? CUSTOMERS.find(c=>c.id===oid) : SUPPLIERS.find(s=>s.id===oid);
    if(owner) chatThread(owner, rest.join(':')); // makes a brand-new (still empty) chat show up below too
  }
  const rows = [];
  CUSTOMERS.forEach(c=> entityThreads(c).forEach(t=> rows.push({type:'client', id:c.id, personName:c.company, photo:c.photo, email:c.email, phone:c.phone, threadName:t.name, key:'client:'+c.id+':'+t.name, ts:t.ts})));
  SUPPLIERS.forEach(s=> entityThreads(s).forEach(t=> rows.push({type:'supplier', id:s.id, personName:s.name, photo:s.photo, email:s.email, phone:s.phone, threadName:t.name, key:'supplier:'+s.id+':'+t.name, ts:t.ts})));
  rows.sort((a,b)=>b.ts-a.ts);
  if(!STATE.ui.activeChatKey && rows.length) STATE.ui.activeChatKey = rows[0].key;
  const active = rows.find(r=>r.key===STATE.ui.activeChatKey) || rows[0];
  const owner = active ? (active.type==='client' ? CUSTOMERS.find(c=>c.id===active.id) : SUPPLIERS.find(s=>s.id===active.id)) : null;
  const msgs = active ? chatThread(owner, active.threadName) : [];
  return `
  <div class="content-inner messages-shell">
    <div class="page-header"><div><div class="page-title">Mensajes</div><div class="page-subtitle">Conversaciones directas con clientes y proveedores.</div></div>
      <button class="btn btn-primary" onclick="App.openNewChatModal()"><i data-lucide="message-square-plus"></i>Nuevo Chat</button>
    </div>
    <div class="chat-panel">
      <div class="chat-list">
        ${rows.map(r=>`<div class="chat-list-item ${active&&active.key===r.key?'active':''}" onclick="App.openInnousChatThread('${r.key}')">
          ${avatarHtml(r.photo, initials(r.personName), r.type==='client'?'var(--accent)':'var(--ink)', 34)}
          <div><div style="font-weight:600;font-size:13px;">${escAttr(r.personName)}</div><div class="td-sub">${r.type==='client'?'Cliente':'Proveedor'} · ${escAttr(r.threadName)}</div></div>
        </div>`).join('') || emptyState('message-square','Aún no hay conversaciones','')}
      </div>
      <div class="chat-thread">
        ${active? `
        <div class="chat-thread-header" style="display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:10px;min-width:0;">
            ${avatarHtml(owner.photo, initials(active.personName), active.type==='client'?'var(--accent)':'var(--ink)', 40)}
            <div style="min-width:0;">
              <div style="font-weight:700;">${escAttr(active.personName)} <span class="td-sub" style="font-weight:400;">· ${escAttr(active.threadName)}</span></div>
              <div class="td-sub">${active.type==='client'?'Cliente':'Proveedor'}${active.email?' · '+escAttr(active.email):''}${active.phone?' · '+escAttr(active.phone):''}</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;flex:0 0 auto;">
            <button class="btn btn-secondary btn-sm" onclick="navigate('#/innous/${active.type==='client'?'customer':'supplier'}/${active.id}')" title="Ver perfil"><i data-lucide="user"></i></button>
            <button class="btn btn-secondary btn-sm" style="color:var(--danger);" onclick="App.deleteChat('${active.type}','${active.id}','${escAttr(active.threadName)}')" title="Eliminar chat"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
        <div class="chat-messages">${chatMessagesHtml(msgs, 'innous', active.personName, 'Aún no hay mensajes — di hola.')}</div>
        ${chatComposeRowHtml(active.key, 'innous-chat-input', 'innous-chat-file-input', `Mensaje para ${active.personName}...`)}
        ` : emptyState('message-square','Aún no hay conversaciones','')}
      </div>
    </div>
  </div>`;
};

// One collapsible category row for the Ajustes accordion (fix48) — closed
// by default, and opening one closes whatever else was open (see
// App.toggleSettingsSection), so the page reads as a short menu of options
// instead of every category's fields sitting open at once.
function settingsSection(key, icon, title, sub, bodyHtml, danger){
  const open = STATE.ui.settingsOpenSection===key;

  const iconSvgStyle = danger?' style="stroke:var(--danger);"':'';
  const panelStyle = danger?' style="border-color:#F9C6C6;"':'';
  return `
  <div class="settings-toggle ${open?'open':''}" onclick="App.toggleSettingsSection('${key}')">

    ${declined ? `<div class="field-hint">Otro proveedor aceptó este proyecto antes que tú.</div>` : !submitted ? `<button class="btn btn-primary btn-block" onclick="navigate('#/supplier/rfq/${p.id}')">Ver RFQ</button>` : isTargetPrice ? `<div class="field-hint">${p.innousAuthorizedAt ? 'Aceptaste este proyecto — consulta el detalle en Mis Órdenes.' : 'Aceptaste este proyecto — INNOUS está finalizando los detalles del pedido.'}</div>` : `<div class="field-hint">Ya enviaste tu cotización — consulta su estatus en Mis Cotizaciones.</div>`}

// Target-price RFQs replace the normal quote form entirely: the supplier
// only ever sees the fixed MXN budget INNOUS already computed (never the
// client's raw USD target price or INNOUS's markup %) and picks
// Accept/Decline — no unit-price negotiation, since the whole point of a
// target price is that the client already set the number.
function targetPriceSupplierSection(p, q, declined, submitted){
  if(declined){
    return `<div class="card card-pad"><div class="section-title">Proyecto No Asignado</div><div class="section-sub" style="margin-top:6px;">Otro proveedor aceptó este proyecto al precio fijo antes que tú. Gracias por tu interés — te seguiremos invitando a nuevos RFQs según tus capacidades.</div></div>`;
  }
  if(submitted){
    // supplierWon() (and therefore the Order page) only unlocks once INNOUS
    // authorizes the project (see App.authorizeProject) — same gate every
    // other awarded supplier goes through, target price or not. Until then
    // this card is the only confirmation the supplier gets.
    const authorized = !!p.innousAuthorizedAt;
    return `<div class="card card-pad"><div class="section-title">Aceptaste Este Proyecto</div><div class="section-sub" style="margin-top:6px;">Confirmaste el precio fijo de ${fmtMXN(p.targetPriceSupplierBudgetMxn)}. ${authorized ? 'El proyecto es tuyo — consulta los siguientes pasos en tu pedido.' : 'INNOUS está finalizando los detalles del pedido — te notificaremos en cuanto esté listo para producción.'}</div>${authorized ? `<button class="btn btn-secondary" style="margin-top:14px;" onclick="navigate('#/supplier/order/${p.id}')">Ver Orden</button>` : ''}</div>`;
  }
  return `
  <div class="card card-pad">
    <div class="section-title">Precio Fijo del Cliente</div>
    <div class="section-sub" style="margin-top:6px;">El cliente ya fijó el presupuesto para este proyecto. El primer proveedor que acepte se queda con el proyecto de inmediato — no hay comparación de cotizaciones.</div>
    <div style="margin:18px 0;"><div class="field-label">Precio Fijo (IVA incluido)</div><div style="font-size:28px;font-weight:700;margin-top:4px;">${fmtMXN(withIva(p.targetPriceSupplierBudgetMxn))}</div><div class="field-hint" style="margin-top:4px;">Subtotal ${fmtMXN(p.targetPriceSupplierBudgetMxn)} + IVA (16%)</div></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="App.acceptTargetPrice('${p.id}')"><i data-lucide="check-circle"></i>Aceptar a ${fmtMXN(p.targetPriceSupplierBudgetMxn)}</button>
      <button class="btn btn-secondary" onclick="App.declineTargetPrice('${p.id}')">No Puedo con Este Precio</button>
    </div>
  </div>`;
}

// full — a proper itemized breakdown (unit price × qty, extras, total) plus

function supplierSubmittedQuoteCard(p, q){
  return `
  <div class="card card-pad">
    <div class="section-title">Tu Cotización Enviada</div>
    <div class="section-sub">${procES(p.process)}${p.material?' · '+p.material:''} — ${p.quantity.toLocaleString()} pzas</div>

      <div class="pricing-row"><span>Subtotal</span><span>${fmtMXN(q.quotedTotal)}</span></div>
      <div class="pricing-row"><span>IVA (16%)</span><span>${fmtMXN(q.quotedTotal*IVA_RATE)}</span></div>
      <div class="pricing-row total"><span>Total de tu Cotización (IVA incluido)</span><span>${fmtMXN(withIva(q.quotedTotal))}</span></div>

    <div class="info-grid" style="grid-template-columns:1fr 1fr;margin-top:16px;">

      ${infoItem('Destino', p.deliveryLocation)}

  </div>`;

// Every field is backed by STATE.ui.supplierQuoteDrafts, not just the raw
// DOM value — a plain uncontrolled form here was losing everything the
// supplier had typed the moment anything re-rendered #app-content out from
// under them mid-form (most commonly: the ~12s background live-updates
// poll, see pollLiveUpdates, firing at the exact instant no field happened
// to be focused, e.g. between tabbing from one field to the next). With
// the draft, a re-render just rebuilds the same inputs with the same
// values already in them — nothing typed is lost, worst case the cursor
// jumps to the end of whatever field was mid-edit.
function supplierQuoteForm(p){
  // A multi-item RFQ (fix37) gets one unit-price input PER item instead of
  // one for the whole thing — a single blended price stopped making sense
  // once an RFQ could bundle different parts at different quantities (see
  // fix42 / supplierQuotePriceRows). A single-item RFQ (still the common
  // case, and every pre-existing RFQ) renders exactly as before.
  const multiItem = !!(p.items && p.items.length>1);
  if(!STATE.ui.supplierQuoteDrafts[p.id]){
    STATE.ui.supplierQuoteDrafts[p.id] = { unitPrice:'', itemPrices: multiItem ? p.items.map(()=>'') : [], leadTimeDays:'', validity:'30 días', notes:'' };
  }
  const d = STATE.ui.supplierQuoteDrafts[p.id];
  if(multiItem && (!d.itemPrices || d.itemPrices.length!==p.items.length)) d.itemPrices = p.items.map((_,i)=>d.itemPrices?.[i] ?? '');
  const upd = (field)=>`App.updateSupplierQuoteDraft('${p.id}','${field}',this.value)`;
  const priceFieldsHtml = multiItem ? `
    <div class="section-sub" style="margin:-2px 0 12px;">Este RFQ tiene ${p.items.length} partidas — pon el precio unitario de cada una.</div>
    ${p.items.map((it,i)=>`
      <div class="form-group">
        <label class="field-label">Partida ${i+1} — ${escAttr((it.description||'').length>60?it.description.slice(0,60)+'…':(it.description||''))} (Cant. ${(it.quantity||0).toLocaleString()})</label>
        <input type="number" step="0.01" min="0" required placeholder="Precio unitario, MXN" value="${escAttr(d.itemPrices[i])}" oninput="App.updateSupplierItemPrice('${p.id}',${i},this.value)">
      </div>`).join('')}
    <div class="form-group"><label class="field-label">Tiempo de entrega (días)</label><input type="number" name="leadTimeDays" required placeholder="ej. 28" value="${d.leadTimeDays}" oninput="${upd('leadTimeDays')}"></div>
  ` : `
    <div class="form-row">
      <div class="form-group"><label class="field-label">Precio unitario (MXN)</label><input type="number" step="0.01" name="unitPrice" required placeholder="ej. 3,200.00" value="${d.unitPrice}" oninput="${upd('unitPrice')}"></div>

ROUTES['supplier/quote'] = function(id){
  const p = findProject(id); if(!p || !p.invitedSupplierIds.includes(STATE.supplierId)) return emptyState('lock','Cotización no disponible','Esta solicitud no fue enviada a tu empresa.');
  const q = supplierQuoteFor(p);

  const won = supplierWon(p);
  return `

    ${stageBanner(rfqStageMessage(p,'supplier'), p.status==='completed'||won?'success':'info')}
    ${supplierSubmittedQuoteCard(p, q)}
    ${won && p.order ? `<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="navigate('#/supplier/order/${p.id}')"><i data-lucide="package"></i>Ver Pedido</button>` : ''}

// True only once INNOUS has authorized the project (see App.authorizeProject) —
// everywhere the supplier's own portal would reveal "you won this RFQ" checks
// this instead of the raw selectedSupplierId match, so the award stays
// invisible to them until INNOUS releases it.
function supplierWon(p){ return p.selectedSupplierId===STATE.supplierId && !!p.innousAuthorizedAt; }
function supplierQuoteStatusBadge(p){
  // Checked in this order on purpose: an unauthorized win must never fall
  // through to "Completada"/"Ganada" below, however far along the project
  // otherwise looks — from this supplier's point of view it's still just
  // "under review" until INNOUS says otherwise.
  if(p.selectedSupplierId===STATE.supplierId && !p.innousAuthorizedAt) return '<span class="badge badge-blue">En Revisión</span>';
  if(p.status==='completed') return '<span class="badge badge-purple">Completada</span>';
  if(supplierWon(p)) return '<span class="badge badge-green">Ganada</span>';
  if(p.status==='customer_review'||p.shortlist.length===0) return '<span class="badge badge-blue">En Revisión</span>';
  return '<span class="badge badge-gray">Rechazada</span>';
}

/* =====================================================================
   APP ACTIONS (global handlers used by inline onclick/onsubmit)
   ===================================================================== */
const App = {
  /* ---- Auth: landing / signup / login ---- */
  goToLogin(){ STATE.authView='login'; renderAuthRoot(); },
  // Suppliers no longer self-register (fix50) — Innous creates their
  // accounts from #/innous/new-supplier, precisely to keep fake/unverified
  // suppliers off the platform. With only one public role left, skip the
  // now-pointless "who are you" picker and go straight to the Client form.
  goToSignup(){ App.pickSignupRole('CLIENT'); },
  backToLanding(){ STATE.authView='landing'; STATE.signupRole=null; renderAuthRoot(); },
  pickSignupRole(role){ STATE.signupRole=role; STATE.authView='signup'; STATE.ui.signupStep=0; renderAuthRoot(); },
  async submitSignup(e){
    e.preventDefault();
    const f = new FormData(e.target);
    const role = STATE.signupRole; // always CLIENT or SUPPLIER — the role picker never offers INNOUS
    const es = role==='SUPPLIER';
    const email = f.get('email').trim().toLowerCase();
    const password = f.get('password'), password2 = f.get('password2');
    if(password!==password2){ showToast(es?'Las contraseñas no coinciden':'Passwords do not match'); return false; }
    if(password.length<6){ showToast(es?'La contraseña debe tener al menos 6 caracteres':'Password must be at least 6 characters'); return false; }
    if(es && f.getAll('capabilities').length===0){ showToast('Selecciona al menos un servicio que ofreces'); return false; }
    const submitBtn = e.target.querySelector('button[type=submit]'); if(submitBtn) submitBtn.disabled = true;
    try{
      const { data, error } = await withTimeout(sb.auth.signUp({ email, password }), 12000, 'signup');
      if(error || !data.user){
        showToast(error?.message || (es?'No se pudo crear la cuenta':'Could not create account'));
        if(submitBtn) submitBtn.disabled = false;
        return false;
      }
      const cityState = `${f.get('city').trim()}, ${f.get('state').trim()}`;
      const { error: profileErr } = await sb.from('profiles').insert({ user_id: data.user.id, role });
      if(profileErr){ showToast(profileErr.message); if(submitBtn) submitBtn.disabled=false; return false; }
      if(role==='CLIENT'){
        await sb.from('customers').insert({
          user_id: data.user.id, company: f.get('company').trim(), contact: f.get('contact').trim(), email,
          phone: f.get('phone').trim(), city: cityState, industry: f.get('industry'),
        });
      } else {
        await sb.from('suppliers').insert({
          user_id: data.user.id, name: f.get('company').trim(), contact_name: f.get('contact').trim(), email,
          phone: f.get('phone').trim(), city: cityState,
          capabilities: f.getAll('capabilities'), certs: f.getAll('certs'),

  // Innous creates a supplier's account (fix50) — see the comment on
  // createIsolatedAuthClient() for why this is safe to run from Innous's
  // own logged-in session without kicking Innous out of it. Everything
  // beyond these five fields (RFC, Razón Social, Domicilio, capabilities,
  // certs…) is filled in later from the new supplier's own detail page,
  // exactly like any other supplier — this just gets a working login and
  // the minimum to identify them.
  async createSupplierAccount(){
    const d = STATE.ui.newSupplierDraft;
    const email = (d.email||'').trim().toLowerCase();
    const password = d.password||'', password2 = d.password2||'';
    const company = (d.company||'').trim(), contactName = (d.contactName||'').trim();
    if(!email || !email.includes('@')){ showToast('Escribe un correo válido.'); return; }
    if(password.length<6){ showToast('La contraseña debe tener al menos 6 caracteres.'); return; }
    if(password!==password2){ showToast('Las contraseñas no coinciden.'); return; }
    if(!company){ showToast('Escribe el nombre de la empresa.'); return; }
    if(!contactName){ showToast('Escribe el nombre del contacto.'); return; }
    try{
      const tempClient = createIsolatedAuthClient();
      const { data, error } = await withTimeout(tempClient.auth.signUp({ email, password }), 12000, 'signup');
      if(error || !data.user){ showToast(error?.message || 'No se pudo crear la cuenta.'); return; }
      if(!data.session){
        // Email confirmation is on for this project — the new user exists
        // but isn't authenticated yet, so the self-insert calls below would
        // fail RLS. Not expected (self-signup already relies on this being
        // off), but fail loudly rather than leaving a half-created account.
        showToast('La cuenta se creó pero requiere confirmación por correo — revisa la configuración de autenticación en Supabase.');
        return;
      }
      const { error: profileErr } = await tempClient.from('profiles').insert({ user_id: data.user.id, role: 'SUPPLIER' });
      if(profileErr){ showToast('Cuenta creada, pero falló el perfil: '+profileErr.message); return; }
      const { error: supplierErr } = await tempClient.from('suppliers').insert({
        user_id: data.user.id, name: company, contact_name: contactName, email, photo_url: d.photo||null,
      });
      if(supplierErr){ showToast('Cuenta creada, pero falló el registro de proveedor: '+supplierErr.message); return; }
      await refreshRealCustomersAndSuppliers();
      STATE.ui.newSupplierDraft = null;
      showToast('Cuenta de proveedor creada', 'success');
      navigate('#/innous/supplier/'+data.user.id);
    }catch(err){
      console.error('createSupplierAccount failed', err);
      showToast('No se pudo conectar. Intenta de nuevo.');
    }
  },

  /* ---- Delete a customer or supplier account (INNOUS only) ----
     Revokes login access and removes their profile. Past RFQs/orders are
     kept as historical records rather than silently erased — they just
     display as "Deleted Customer"/"Deleted Supplier" from then on (see
     customerName()/supplierName()), the same way a real ledger wouldn't
     un-happen a completed order just because the account was closed. */
  async deleteCustomer(id){
    const c = CUSTOMERS.find(x=>x.id===id); if(!c) return;
    const proj = PROJECTS.filter(p=>p.customerId===id);
    const active = proj.filter(p=>['awarded','in_production'].includes(p.status)).length;
    let msg = `¿Eliminar de forma permanente la cuenta de "${c.company}"? Ya no podrán iniciar sesión.`;
    if(proj.length) msg += ` Tienen ${proj.length} RFQ${proj.length===1?'':'s'} registrado${proj.length===1?'':'s'}${active?` (${active} aún activo${active===1?'':'s'})`:''} — se quedan en el sistema para el historial, pero aparecerán como "Deleted Customer".`;
    if(!confirm(msg)) return;
    CUSTOMERS.splice(CUSTOMERS.indexOf(c),1);
    if(isRealAccountId(id)){
      // Runs a database function that removes their profile/customer rows AND
      // the underlying login credential itself — so the email is actually
      // free to sign up again, not just locked out forever. The function
      // does the privileged part server-side; this app never holds the key
      // that would otherwise be needed for that.
      const { error } = await sb.rpc('innous_delete_account', { p_user_id: id });
      if(error){ showToast(error.message); return; }
    } else { const ids=loadDeletedDemoIds(); if(!ids.includes(id)){ ids.push(id); saveDeletedDemoIds(ids); } } // example (non-account) customer — remember so it stays gone after a refresh
    showToast('Cuenta del cliente eliminada', 'success');
    navigate('#/innous/customers');
  },
  async deleteSupplier(id){
    const s = SUPPLIERS.find(x=>x.id===id); if(!s) return;
    const proj = PROJECTS.filter(p=>p.invitedSupplierIds.includes(id));
    const active = proj.filter(p=>p.selectedSupplierId===id && ['awarded','in_production'].includes(p.status)).length;
    let msg = `¿Eliminar de forma permanente la cuenta de "${s.name}"? Ya no podrán iniciar sesión.`;
    if(proj.length) msg += ` Están en ${proj.length} RFQ${proj.length===1?'':'s'} registrado${proj.length===1?'':'s'}${active?` (${active} aún activo${active===1?'':'s'})`:''} — se quedan en el sistema para el historial, pero aparecerán como "Deleted Supplier".`;
    if(!confirm(msg)) return;
    SUPPLIERS.splice(SUPPLIERS.indexOf(s),1);
    if(isRealAccountId(id)){
      const { error } = await sb.rpc('innous_delete_account', { p_user_id: id });
      if(error){ showToast(error.message); return; }
    } else { const ids=loadDeletedDemoIds(); if(!ids.includes(id)){ ids.push(id); saveDeletedDemoIds(ids); } } // example (non-account) supplier — remember so it stays gone after a refresh
    showToast('Cuenta del proveedor eliminada', 'success');
    navigate('#/innous/suppliers');
  },
  /* Unlike deleting a customer/supplier account, this really does erase the
     RFQ — there's no "keep it for history" case here, since an RFQ with no
     one left to attribute it to (its customer already deleted) is exactly
     the clutter this exists to clean up. Real RFQs cascade-delete their
     invitations/quotes/order/messages in the database automatically. */
  async deleteRfq(id){
    const p = findProject(id); if(!p) return;
    if(!confirm(`¿Eliminar de forma permanente el RFQ ${p.id} ("${p.projectName}")? Esto no se puede deshacer.`)) return;
    // Gather who needs to be told BEFORE the row (and its invited_suppliers
    // rows, via cascade) disappears — the client and every real invited
    // supplier get a dismissible notification, so they find out even if
    // they weren't online when this happened. Two separate calls so each
    // gets the notice in their own portal's language (client=English,
    // supplier=Spanish), matching the rest of the app.
    const clientId = !p.isDemo && isRealAccountId(p.customerId) ? p.customerId : null;
    const supplierIds = p.isDemo ? [] : p.invitedSupplierIds.filter(isRealAccountId);
    PROJECTS.splice(PROJECTS.indexOf(p),1);
    if(!p.isDemo){
      if(clientId){
        const { error: e1 } = await sb.rpc('innous_send_notification', {
          p_user_ids: [clientId],
          p_title: `RFQ ${p.id} was deleted`,
          p_body: `INNOUS deleted "${p.projectName}" — it's no longer part of your active RFQs.`,
          p_project_id: p.id,
        });
        if(e1) console.error('innous_send_notification (client) failed', e1);
      }
      if(supplierIds.length){
        const { error: e2 } = await sb.rpc('innous_send_notification', {
          p_user_ids: supplierIds,
          p_title: `El RFQ ${p.id} fue eliminado`,
          p_body: `INNOUS eliminó "${p.projectName}" — ya no forma parte de tus RFQs activos.`,
          p_project_id: p.id,
        });
        if(e2) console.error('innous_send_notification (suppliers) failed', e2);
      }
      const { error } = await sb.from('projects').delete().eq('id', id);
      if(error){ showToast(error.message); return; }
    }
    showToast('RFQ eliminado', 'success');
    navigate('#/innous/rfqs');
  },
  // "Reject / Close Project" (fix38) — for when INNOUS just can't make this
  // RFQ work (usually: no willing supplier), instead of leaving it stuck in
  // sourcing forever. Unlike Delete, this KEEPS the record and its history —
  // it's a real terminal status the customer sees, with the reason INNOUS
  // gives them, not a disappearance.
  openRejectRfqModal(pid){
    const p = findProject(pid); if(!p) return;
    STATE.ui.rejectRfqReason = '';
    openModal(`
      <div class="modal-header"><h3>Rechazar / Cerrar Proyecto</h3><button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="modal-body">
        <div class="field-hint" style="margin-bottom:12px;">Esto cierra el RFQ ${p.id} ("${escAttr(p.projectName)}") de forma definitiva — se notifica al cliente de inmediato y ve esta razón en su página del RFQ. Úsalo cuando el proyecto genuinamente no sea viable (ej. ningún proveedor quiso tomarlo), no solo para limpiar la lista.</div>
        <div class="form-group"><label class="field-label">Razón (se le muestra al cliente)</label><textarea id="reject-rfq-reason" placeholder="ej. No pudimos encontrar un socio de manufactura con la capacidad y capacidades correctas para este proyecto en un tiempo razonable." oninput="STATE.ui.rejectRfqReason=this.value"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" onclick="App.confirmRejectRfq('${p.id}')"><i data-lucide="x-circle"></i>Cerrar Proyecto y Notificar al Cliente</button>
      </div>
    `);
  },
  async confirmRejectRfq(pid){
    const p = findProject(pid); if(!p) return;
    const reason = (STATE.ui.rejectRfqReason||'').trim();
    if(!reason){ showToast('Se requiere una razón — el cliente la verá.'); return; }
    const now = new Date();
    p.status = 'rejected'; p.rejectedReason = reason; p.rejectedAt = now;
    logActivity(p, 'INNOUS', `RFQ closed: ${reason}`);
    closeModal();
    if(!p.isDemo){
      const { error } = await sb.from('projects').update({
        status: 'rejected', rejected_reason: reason, rejected_at: now.toISOString(), activity: p.activity,
      }).eq('id', p.id);
      if(error){ showToast(error.message); return; }
      const clientId = isRealAccountId(p.customerId) ? p.customerId : null;
      const supplierIds = p.invitedSupplierIds.filter(isRealAccountId);
      if(clientId){
        const { error: e1 } = await sb.rpc('innous_send_notification', {
          p_user_ids: [clientId],
          p_title: `RFQ ${p.id} was closed`,
          p_body: `INNOUS was unable to move forward with "${p.projectName}". Reason: ${reason}`,
          p_project_id: p.id, p_link: '#/client/rfq/'+p.id,
        });
        if(e1) console.error('innous_send_notification (client) failed', e1);
      }
      // Courtesy notice to anyone already invited — they were never going to
      // hear about this otherwise, since a rejected RFQ simply stops
      // appearing in their "RFQs Disponibles"/dashboard lists.
      if(supplierIds.length){
        const { error: e2 } = await sb.rpc('innous_send_notification', {
          p_user_ids: supplierIds,
          p_title: `El RFQ ${p.id} fue cerrado`,
          p_body: `Innous cerró "${p.projectName}" — ya no está disponible para cotizar.`,
          p_project_id: p.id,
        });
        if(e2) console.error('innous_send_notification (suppliers) failed', e2);
      }
    }
    showToast('RFQ cerrado', 'success');
    route();
  },

  async saveAccount(){
    const es = STATE.role!=='CLIENT';
    // Validate the password fields (cheap, no network) before touching anything —
    // and do the profile-field save BEFORE the password change, not after: changing
    // the password rotates the session's access token, and an update sent right

  /* ---- 1:1 photo cropper (pure canvas, no dependencies) ---- */
  openCropModal(dataUrl, target){
    const es = STATE.role!=='CLIENT';
    STATE.ui.cropState = {scale:1, x:0, y:0, coverW:0, coverH:0, dataUrl, target: target||'account'};
    openModal(`
      <div class="modal-header"><h3>${es?'Ajustar foto':'Adjust photo'}</h3><button class="modal-close" onclick="App.cancelCrop()"><i data-lucide="x"></i></button></div>
      <div class="modal-body">
        <div class="crop-viewport" id="crop-viewport">
          <img id="crop-img" src="${dataUrl}" alt="">
          <div class="crop-circle-guide"></div>
        </div>
        <div class="crop-zoom-row">
          <i data-lucide="zoom-out" style="width:15px;height:15px;color:var(--ink-tertiary);"></i>
          <input type="range" id="crop-zoom" min="100" max="300" value="100" oninput="App.setCropZoom(this.value)">
          <i data-lucide="zoom-in" style="width:15px;height:15px;color:var(--ink-tertiary);"></i>
        </div>
        <div class="field-hint" style="text-align:center;margin-top:8px;">${es?'Arrastra para reposicionar · usa el control para acercar':'Drag to reposition · use the slider to zoom'}</div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="App.cancelCrop()">${es?'Cancelar':'Cancel'}</button><button class="btn btn-primary" onclick="App.saveCrop()"><i data-lucide="check"></i>${es?'Guardar foto':'Save photo'}</button></div>
    `);
    const img = document.getElementById('crop-img');
    const finishSetup = ()=>{
      const VP = 240;
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const ratio = Math.max(VP/nw, VP/nh);
      STATE.ui.cropState.coverW = nw*ratio;
      STATE.ui.cropState.coverH = nh*ratio;
      App.applyCropTransform();
      App.attachCropDrag();
    };
    if(img.complete && img.naturalWidth) finishSetup(); else img.onload = finishSetup;
  },
  applyCropTransform(){
    const VP = 240;
    const c = STATE.ui.cropState;
    const img = document.getElementById('crop-img');
    if(!img) return;
    const w = c.coverW*c.scale, h = c.coverH*c.scale;
    img.style.width = w+'px';
    img.style.height = h+'px';
    img.style.left = (((VP-w)/2) + c.x)+'px';
    img.style.top = (((VP-h)/2) + c.y)+'px';
  },
  setCropZoom(val){
    const c = STATE.ui.cropState;
    const newScale = val/100;
    // re-clamp existing pan to the new zoom level so the image never reveals empty space
    const VP = 240;
    const w = c.coverW*newScale, h = c.coverH*newScale;
    const maxX = Math.max(0,(w-VP)/2), maxY = Math.max(0,(h-VP)/2);
    c.scale = newScale;
    c.x = Math.max(-maxX, Math.min(maxX, c.x));
    c.y = Math.max(-maxY, Math.min(maxY, c.y));
    App.applyCropTransform();
  },
  attachCropDrag(){
    const vp = document.getElementById('crop-viewport');
    if(!vp) return;
    let dragging = false, startX=0, startY=0, origX=0, origY=0;
    const VP = 240;
    const onDown = (e)=>{
      dragging = true;
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX; startY = pt.clientY;
      const c = STATE.ui.cropState; origX = c.x; origY = c.y;
      e.preventDefault();
    };
    const onMove = (e)=>{
      if(!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const c = STATE.ui.cropState;
      const w = c.coverW*c.scale, h = c.coverH*c.scale;
      const maxX = Math.max(0,(w-VP)/2), maxY = Math.max(0,(h-VP)/2);
      c.x = Math.max(-maxX, Math.min(maxX, origX + (pt.clientX-startX)));
      c.y = Math.max(-maxY, Math.min(maxY, origY + (pt.clientY-startY)));
      App.applyCropTransform();
    };
    const onUp = ()=>{ dragging = false; };
    vp.onmousedown = onDown; vp.ontouchstart = onDown;
    document.onmousemove = (e)=>{ onMove(e); };
    document.ontouchmove = (e)=>{ if(dragging){ onMove(e); } };
    document.onmouseup = onUp; document.ontouchend = onUp;
  },
  cancelCrop(){
    const target = STATE.ui.cropState?.target || 'account';
    STATE.ui.cropState = null;
    document.onmousemove = null; document.onmouseup = null; document.ontouchmove = null; document.ontouchend = null;
    if(target==='new-supplier') closeModal(); else App.openAccountModal();
  },
  saveCrop(){
    const c = STATE.ui.cropState;
    const img = document.getElementById('crop-img');
    const OUT = 320, VP = 240;
    const k = OUT/VP;
    const canvas = document.createElement('canvas');
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext('2d');
    const w = c.coverW*c.scale*k, h = c.coverH*c.scale*k;
    const left = (((VP-c.coverW*c.scale)/2) + c.x)*k;
    const top = (((VP-c.coverH*c.scale)/2) + c.y)*k;
    ctx.drawImage(img, left, top, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    document.onmousemove = null; document.onmouseup = null; document.ontouchmove = null; document.ontouchend = null;
    const target = c.target || 'account';
    STATE.ui.cropState = null;
    if(target==='new-supplier'){
      if(!STATE.ui.newSupplierDraft) STATE.ui.newSupplierDraft = { email:'', password:'', password2:'', contactName:'', company:'', photo:null };
      STATE.ui.newSupplierDraft.photo = dataUrl;
      closeModal();
      route();
    } else {
      if(!STATE.ui.accountDraft) STATE.ui.accountDraft = {name:'', company:'', photo:null};
      STATE.ui.accountDraft.photo = dataUrl;
      App.openAccountModal();
    }
  },

  /* ---- ZIP/postal code → city, state autofill (Delivery location) ----
     Uses the free, keyless Zippopotam.us lookup API. Doesn't block
     submission if it fails or the code isn't found — the field stays a
     normal editable text input, this just saves typing when it works. */
  async lookupDeliveryZip(){
    const zip = (STATE.ui.newRfqDraft.deliveryZip||'').trim();
    const country = (STATE.ui.newRfqDraft.deliveryCountry||'US').toLowerCase();
    const statusEl = document.getElementById('zip-lookup-status');
    const locField = document.querySelector('input[name=deliveryLocation]');
    if(!zip){ if(statusEl) statusEl.textContent=''; return; }
    const myToken = (STATE.ui.zipLookupToken = (STATE.ui.zipLookupToken||0) + 1);
    if(statusEl){ statusEl.textContent = 'Looking up…'; statusEl.className = 'field-hint'; }
    try{
      const res = await fetch(`https://api.zippopotam.us/${country}/${encodeURIComponent(zip)}`);
      if(myToken !== STATE.ui.zipLookupToken) return; // a newer lookup superseded this one
      if(!res.ok){ if(statusEl){ statusEl.textContent='ZIP code not found — enter the city manually.'; } return; }
      const data = await res.json();
      const place = data.places && data.places[0];
      if(place){
        const city = place['place name'];
        const state = place['state abbreviation'] || place['state'] || '';
        const combined = state ? `${city}, ${state}` : city;
        STATE.ui.newRfqDraft.deliveryLocation = combined;
        if(locField) locField.value = combined;
        if(statusEl){ statusEl.textContent = '✓ Filled in from ZIP code'; statusEl.className = 'field-hint account-pw-hint-ok'; }
      }
    }catch(err){
      if(myToken===STATE.ui.zipLookupToken && statusEl) statusEl.textContent = "Couldn't look that up — enter the city manually.";
    }
  },
  /* ---- Real file selection for a new RFQ (uploaded to Storage on submit,

  addRealFiles(fileList){
    const allowedExt = ['pdf','step','stp','dwg','dxf','jpg','jpeg','png'];
    const maxSize = 25*1024*1024;
    const rejected = [];
    Array.from(fileList).forEach(file=>{

      if(!allowedExt.includes(ext)){ rejected.push(`${file.name} (tipo no soportado)`); return; }
      if(file.size > maxSize){ rejected.push(`${file.name} (más de 25 MB)`); return; }
      const type = ext==='stp' ? 'step' : (ext==='jpeg' ? 'jpg' : ext);
      STATE.ui.newRfqFiles.push({ file, name:file.name, type, size:formatFileSize(file.size) });
    });
    if(rejected.length) showToast('No se pudieron agregar: '+rejected.join(', '));
    route();

  closeRedactModal(){ STATE.ui.redactState = null; closeModal(); },
  // Renders one page onto the canvas, rendering it via pdf.js the first time
  // it's visited and reusing the same offscreen canvas on every later visit
  // (so flipping back and forth between pages never loses boxes already
  // drawn there, and doesn't re-render the page from scratch each time).
  async loadRedactPage(n){
    const st = STATE.ui.redactState; if(!st || n<1 || n>st.numPages) return;
    st.pageNum = n;
    if(!st.boxesByPage[n]) st.boxesByPage[n] = [];
    if(!st.sources[n] && st.fileType==='pdf'){
      const page = await st.pdfDoc.getPage(n);
      const viewport = page.getViewport({scale:2});
      const off = document.createElement('canvas');
      off.width = viewport.width; off.height = viewport.height;
      await page.render({canvasContext: off.getContext('2d'), viewport}).promise;
      if(!STATE.ui.redactState || STATE.ui.redactState.pageNum!==n) return; // navigated away again while this page was still rendering
      st.sources[n] = off;
    }
    const source = st.sources[n];
    document.querySelector('.modal').innerHTML = redactModalHtml();
    lucide.createIcons();
    const canvas = document.getElementById('redact-canvas');
    canvas.width = source.width || source.naturalWidth;
    canvas.height = source.height || source.naturalHeight;
    redrawRedactCanvas();
  },
  redactMouseDown(e){
    const st = STATE.ui.redactState; if(!st) return;
    const {x,y} = redactCanvasCoords(e, e.target);
    st.drawing = {x0:x, y0:y, x, y, w:0, h:0};
  },
  redactMouseMove(e){
    const st = STATE.ui.redactState; if(!st || !st.drawing) return;
    const {x,y} = redactCanvasCoords(e, e.target);
    const d = st.drawing;
    d.x = Math.min(d.x0, x); d.y = Math.min(d.y0, y);
    d.w = Math.abs(x-d.x0); d.h = Math.abs(y-d.y0);
    redrawRedactCanvas();
  },
  redactMouseUp(e){
    const st = STATE.ui.redactState; if(!st || !st.drawing) return;
    const d = st.drawing;
    if(d.w>4 && d.h>4) st.boxesByPage[st.pageNum].push({x:d.x, y:d.y, w:d.w, h:d.h});
    st.drawing = null;
    redrawRedactCanvas();
    const countEl = document.getElementById('redact-box-count');
    if(countEl) countEl.textContent = `${st.boxesByPage[st.pageNum].length} box(es) on this page${st.numPages>1?` · ${Object.values(st.boxesByPage).reduce((s,b)=>s+b.length,0)} total`:''}`;
  },
  undoRedactBox(){
    const st = STATE.ui.redactState; if(!st || !st.boxesByPage[st.pageNum].length) return;
    st.boxesByPage[st.pageNum].pop();
    redrawRedactCanvas();
    document.getElementById('redact-box-count').textContent = `${st.boxesByPage[st.pageNum].length} box(es) on this page${st.numPages>1?` · ${Object.values(st.boxesByPage).reduce((s,b)=>s+b.length,0)} total`:''}`;
  },
  clearRedactBoxes(){
    const st = STATE.ui.redactState; if(!st) return;
    st.boxesByPage[st.pageNum] = [];
    redrawRedactCanvas();
    document.getElementById('redact-box-count').textContent = `0 box(es) on this page${st.numPages>1?` · ${Object.values(st.boxesByPage).reduce((s,b)=>s+b.length,0)} total`:''}`;
  },
  async saveRedaction(){
    const st = STATE.ui.redactState; if(!st) return;
    const p = findProject(st.projectId); if(!p) return;
    const f = p.files[st.fileIndex]; if(!f) return;
    const saveBtn = document.querySelector('.modal-footer .btn-primary'); if(saveBtn) saveBtn.disabled = true;
    try{
      const baseName = f.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9._-]/g,'_');
      let blob, redactedPath, contentType;
      if(st.fileType==='pdf'){
        // Rebuilds the whole drawing packet as a new PDF, one page at a time,
        // each page's boxes baked directly into that page's image — this way
        // a page the reviewer never even opened (so it has zero boxes) still
        // makes it into the output exactly as it looked originally, instead
        // of only publishing whichever single page got edited.
        const { jsPDF } = window.jspdf;
        let outDoc = null;
        for(let n=1; n<=st.numPages; n++){
          if(!st.sources[n]){
            const page = await st.pdfDoc.getPage(n);
            const viewport = page.getViewport({scale:2});
            const off = document.createElement('canvas');
            off.width = viewport.width; off.height = viewport.height;
            await page.render({canvasContext: off.getContext('2d'), viewport}).promise;
            st.sources[n] = off;
          }
          const source = st.sources[n];
          // Bake onto a fresh copy rather than the live source canvas, so
          // this never mutates whatever page is still on-screen mid-save.
          const bake = document.createElement('canvas');
          bake.width = source.width; bake.height = source.height;
          const bctx = bake.getContext('2d');
          bctx.drawImage(source, 0, 0);
          bctx.fillStyle = '#fff';
          (st.boxesByPage[n]||[]).forEach(b=>bctx.fillRect(b.x,b.y,b.w,b.h));
          const imgData = bake.toDataURL('image/jpeg', 0.92);
          const wPt = 612, hPt = wPt * bake.height/bake.width; // US Letter width, proportional height
          // jsPDF silently swaps width/height to match its orientation default
          // ('p') unless told otherwise — most manufacturing drawings are
          // landscape (wider than tall), so without this every such page came
          // out narrower than the image actually drawn onto it, clipping the
          // right side of the drawing. Passing the real orientation here stops
          // jsPDF from doing that swap.
          const orientation = wPt > hPt ? 'l' : 'p';
          if(!outDoc) outDoc = new jsPDF({ unit:'pt', format:[wPt, hPt], orientation });
          else outDoc.addPage([wPt, hPt], orientation);
          outDoc.addImage(imgData, 'JPEG', 0, 0, wPt, hPt);
        }
        blob = outDoc.output('blob');
        redactedPath = `${st.projectId}/redacted/${Date.now()}-${baseName}.pdf`;
        contentType = 'application/pdf';
      } else {
        const canvas = document.getElementById('redact-canvas'); if(!canvas) return;
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        redactedPath = `${st.projectId}/redacted/${Date.now()}-${baseName}.png`;
        contentType = 'image/png';
      }
      if(!blob){ showToast('No se pudo generar el archivo.'); if(saveBtn) saveBtn.disabled=false; return; }
      const { error: upErr } = await sb.storage.from('project-files').upload(redactedPath, blob, { contentType });
      if(upErr){ showToast(upErr.message); if(saveBtn) saveBtn.disabled=false; return; }
      const newFiles = p.files.map((file,i)=> i===st.fileIndex ? {...file, redactedPath} : file);
      if(!p.isDemo){
        const { error: dbErr } = await sb.from('projects').update({ files:newFiles }).eq('id', st.projectId);
        if(dbErr){ showToast(dbErr.message); if(saveBtn) saveBtn.disabled=false; return; }
      }
      p.files = newFiles;
      STATE.ui.redactState = null;
      closeModal();
      showToast('Versión redactada publicada al proveedor', 'success');
      route();
    }catch(err){
      console.error('saveRedaction failed', err);
      showToast('No se pudo guardar la versión editada.');
      if(saveBtn) saveBtn.disabled = false;
    }
  },
  async submitRfq(e){
    e.preventDefault();
    const f = new FormData(e.target);
    const deliveryMethod = STATE.ui.newRfqDraft.deliveryMethod;
    const deliveryLocation = deliveryMethod==='pickup' ? 'Pickup' : (f.get('deliveryLocation')||'');
    const filesToUpload = STATE.ui.newRfqFiles.filter(x=>x.file);
    const activity = [{ts:new Date().toISOString(), actor:currentClient().company, text:'RFQ submitted.'}];
    const submitBtn = e.target.querySelector('button[type=submit]'); if(submitBtn) submitBtn.disabled = true;
    // Turn the line items the client entered (fix37) into the single
    // aggregate process/quantity/material/description every existing
    // consumer of a project row still expects — supplier matching, the RFQ
    // list, PDFs. `items` itself carries the real per-item breakdown; see
    // the note above rfqItemsBlock(). Per the same logic, this RFQ's overall
    // target price is the SUM of whichever items' target prices the client
    // set (null if none did) — the rest of the target-price flow (INNOUS
    // setting markup/rate, suppliers accepting) already operates on that one
    // total number and needed no changes.
    const items = STATE.ui.newRfqDraft.items.map(it=>({
      description: (it.description||'').trim(), process: it.process, material: (it.material||'').trim(),
      quantity: parseInt(it.quantity)||1, targetPriceUsd: parseFloat(it.targetPriceUsd)||null,
    }));
    const processes = [...new Set(items.map(it=>it.process))];
    const materials = [...new Set(items.map(it=>it.material).filter(Boolean))];
    const totalQuantity = items.reduce((s,it)=>s+it.quantity,0);
    const combinedDescription = items.length===1 ? items[0].description
      : items.map((it,i)=>`Item ${i+1} (${it.quantity.toLocaleString()} × ${it.process}${it.material?', '+it.material:''}): ${it.description}`).join('\n');
    const itemTargetPrices = items.map(it=>it.targetPriceUsd).filter(v=>v>0);
    const targetPriceUsd = itemTargetPrices.length ? itemTargetPrices.reduce((a,b)=>a+b,0) : null;
    try{
      // No `id` here on purpose — the column's DEFAULT (a Postgres sequence,
      // see supabase-fix27-rfq-sequential-folio.sql / fix31) assigns the next
      // clean "RFQ-2026-0000"-style folio atomically, so two clients
      // submitting at the same moment can never end up with the same folio
      // the way a browser-computed one theoretically could.
      const { data: inserted, error } = await withTimeout(sb.from('projects').insert({
        customer_id: STATE.clientId, project_name: f.get('projectName'), description: combinedDescription,
        process: processes.join(', '), quantity: totalQuantity, material: materials.join(', '), items,
        delivery_date: f.get('deliveryDate')||null, delivery_location: deliveryLocation,
        quality_req: 'Standard quality documentation.', special_req: f.get('specialReq')||'—',
        target_price_usd: targetPriceUsd,
        files: [], status:'submitted', activity,
      }).select('id').single(), 12000, 'submitRfq');
      if(error){ showToast(error.message); if(submitBtn) submitBtn.disabled=false; return false; }
      const id = inserted.id;

      // Upload the real files now that the project row exists (Storage RLS
      // checks for a matching project owned by this client) — a failed
      // upload on one file doesn't block the RFQ itself, just that file.
      // Files live under .../original/ — only the client and INNOUS can ever
      // read that folder (see fix16). A supplier only ever sees a file once
      // INNOUS explicitly redacts and publishes a copy under .../redacted/.
      const uploadedFiles = [];
      for(const item of filesToUpload){
        const safeName = item.file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path = `${id}/original/${Date.now()}-${safeName}`;
        const { error: upErr } = await sb.storage.from('project-files').upload(path, item.file);
        if(upErr){ showToast(`No se pudo subir ${item.name}: ${upErr.message}`); continue; }
        uploadedFiles.push({ name:item.name, type:item.type, size:item.size, path });
      }
      if(uploadedFiles.length){
        // Clients have no direct UPDATE grant on projects (only create/read
        // their own) — this narrow RPC is the one exception, and it re-checks
        // ownership itself rather than relying on a blanket UPDATE policy.
        const { error: attachErr } = await sb.rpc('client_attach_rfq_files', { p_project_id: id, p_files: uploadedFiles });
        if(attachErr) showToast(`Files uploaded, but couldn't attach them to the RFQ: ${attachErr.message}`);
      }

      await refreshRealProjects();
      STATE.ui.newRfqDraft = null; STATE.ui.newRfqFiles = [];
      showToast(`RFQ ${id} submitted`, 'success');
      navigate('#/client/rfq/'+id);
    }catch(err){
      console.error('submitRfq failed', err);
      showToast('No se pudo enviar el RFQ. Intenta de nuevo.');
      if(submitBtn) submitBtn.disabled = false;
    }
    return false;
  },
